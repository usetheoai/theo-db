[package]
name = "m107_graph_spike"
version = "0.1.0"
edition = "2021"

# M107 Phase-0 spike: native CSR + frontier-BFS traversal, benchmarked vs the recursive-CTE
# baseline (theo-rag graph-retriever). Zero external deps (own LCG RNG) so the build is fast
# and the measurement is self-contained. Emits the graph as CSV for the Postgres CTE baseline.

[[bin]]
name = "m107_graph_spike"
path = "src/main.rs"

[profile.release]
opt-level = 3
