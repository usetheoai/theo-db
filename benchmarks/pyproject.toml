[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a running theo-db:dev container (pgvector)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.vulture]
# `entry_sql` is a pytest FIXTURE parameter: the test never reads it, because requesting the fixture is what
# triggers its side effect (skip the contract tests when the ClickBench SQL could not be fetched offline).
# Vulture cannot see that, and deleting the parameter would silently disable the offline guard — so the fixture
# is ignored by name rather than "fixed" by removing it.
ignore_names = ["entry_sql"]
