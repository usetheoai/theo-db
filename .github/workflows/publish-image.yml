# Image publish — #187. Segue o playbook do ecossistema (mesmo do theo-memory/theo-rag):
# delega ao workflow REUTILIZÁVEL `usetheodev/theo/.github/workflows/build-publish.yml`, que já entrega
# build + push GHCR, gate Trivy (CRITICAL/HIGH) antes do push, e SBOM + provenance SLSA + assinatura
# keyless cosign nas tags. Escrever um workflow próprio aqui seria reimplementar o que o ecossistema já
# resolve (Regra 9 / parsimony ladder rung 4) — e perderia Trivy, SBOM e assinatura.
#
#   develop push → ghcr.io/usetheodev/theo-db:develop (+ :develop-<sha>)
#   v* tag       → :X.Y.Z + :X.Y + :latest, assinada e verificada
#
# Contexto: a imagem nunca havia sido publicada — `docker pull ghcr.io/usetheodev/theo-db:latest`, o
# primeiro comando do README, falhava com `manifest unknown`. O `ci.yml` constrói a imagem seis vezes,
# mas sempre com `load: true` + tag local, para rodar os testes e descartar.
name: publish
on:
  push:
    branches: [develop]
    tags: ["v*"]
    # Pushes só-de-documentação em develop não gastam a fila do runner.
    #
    # DELIBERADAMENTE `paths-ignore` (lista de exclusão), NÃO o filtro positivo que o `ci.yml`
    # adotou: este workflow escuta `tags: ["v*"]`, e filtro de path se aplica TAMBÉM a push de tag.
    # Um filtro positivo faria um release cujo commit não casasse a lista ser silenciosamente
    # ignorado — nenhuma imagem publicada, nenhum erro. Lista de exclusão erra para o lado seguro
    # (publica a mais), que aqui é o lado certo.
    #
    # Isso posto, a premissa que sustenta o `**/*.md` abaixo é que builds de TAG apontam para merge
    # commits, sempre com código junto. É uma premissa do FLUXO, não uma garantia do mecanismo —
    # registrada como risco latente numa issue própria.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      # Adicionados em 2026-07-27: nada aqui entra na imagem (conferido nos `COPY` do Dockerfile —
      # só `theodb_rs/`, `sql/`, `*.control`). O commit `3313226`, que tocou só workflows e o
      # CHANGELOG, disparou um build+push completo de imagem idêntica.
      - 'docs/**'
      - 'knowledge-base/**'
      - 'agents/**'
      - '.review-runs/**'
      - '.review-loop/**'
      # Mudar um workflow não muda a imagem. Para exercitar uma alteração NESTE arquivo, use o
      # `workflow_dispatch` declarado abaixo — é o escape hatch previsto.
      - '.github/workflows/**'
  workflow_dispatch:

# Runner self-hosted único: pushes sucessivos em develop devem SUPERSEDER o run anterior em vez de
# empilhar. Runs de TAG têm grupo próprio por ref e nunca são cancelados por um push de develop —
# abortar uma publicação de release deixaria manifesto parcial no registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless via OIDC (somente em release)

jobs:
  image:
    uses: usetheodev/theo/.github/workflows/build-publish.yml@develop
    with:
      image: theo-db
      dockerfile: ./Dockerfile
      context: .
      trivy: true
      sign: ${{ startsWith(github.ref, 'refs/tags/v') }}
      verify: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # GitHub-hosted está bloqueado por billing neste org. Usa o label ESPECÍFICO `theodb-do` (mesmo
      # de todos os outros workflows deste repo, `runs-on: [self-hosted, theodb-do]`) e NÃO o genérico
      # `["self-hosted","linux","x64"]` do playbook: os runners da máquina theo-ci-runner (2 GB / 2 vCPU,
      # que serve theo-cloud/theo-lens/theo-memory) carregam exatamente esses labels genéricos, e um job
      # que compila Rust + PostgreSQL não cabe lá. O label específico prende o build na máquina de 8 vCPU.
      runner: '["self-hosted","theodb-do"]'
    # SEM bloco `secrets:` — e sem `secrets: inherit`, que é o que o semgrep barra. O `secrets: {}`
    # anterior expressava a mesma intenção (não repassar nada) mas o actionlint o rejeita como seção
    # vazia; omitir tem efeito idêntico e satisfaz os dois linters. O TheoDB não consome módulo Go
    # privado nem publica no Docker Hub hoje; o GHCR publica com o GITHUB_TOKEN do próprio run.
