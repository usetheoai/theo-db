# publish — build da imagem, portão Trivy e push para o GHCR. NATIVO deste repositório.
#
# POR QUE DEIXOU DE DELEGAR (medido em 2026-08-20, e é a causa-raiz do B-082).
# Este workflow delegava a `usetheoai/theo/.github/workflows/build-publish.yml@develop`. As oito
# execuções registradas desde 2026-07-29 — inclusive a do tag `v0.158.0` — falharam, e as recentes
# com **zero jobs** e a mensagem "This run likely failed because of a workflow file issue".
#
# A causa não era o arquivo. Medido: `usetheoai/theo` é **PRIVADO** e `usetheoai/theo-db` é
# **PÚBLICO**, e o GitHub não permite que um repositório público consuma workflow reutilizável de um
# privado. O `access_level: organization` do repo `theo` libera repos privados/internos da org — não
# públicos. Nenhuma edição aqui resolveria isso: a referência simplesmente não resolve.
#
# Descartadas e por quê: tornar `theo` público é decisão de produto de outro repositório; copiar o
# reutilizável para cá duplicaria um arquivo mantido por outra equipe. Reescrever o mínimo aqui é o
# que mantém a esteira deste repositório autônoma — e autonomia é o que a falha cobrou.
#
# O QUE FOI PRESERVADO do reutilizável: build, **portão Trivy antes do push** e tags por versão.
# O QUE NÃO FOI, declarado em vez de omitido: SBOM, provenance SLSA e assinatura cosign. Cada um
# acrescentaria action de terceiro à superfície que o [[B-083]] já mede em 42 referências não fixadas
# por SHA. Entram quando houver decisão sobre aquele item, não a reboque desta correção.
#
#   develop push → ghcr.io/usetheoai/theo-db:develop (+ :develop-<sha>)
#   v* tag       → :X.Y.Z + :latest
name: publish

on:
  push:
    branches: [develop]
    tags: ["v*"]
    # `paths-ignore` e não filtro positivo: este workflow escuta `tags`, e filtro de path se aplica
    # TAMBÉM a push de tag. Um filtro positivo faria um release cujo commit não casasse a lista ser
    # silenciosamente ignorado — nenhuma imagem, nenhum erro. Lista de exclusão erra para o lado que
    # publica a mais, e aqui esse é o lado seguro.
    paths-ignore:
      - '.claude/**'
      - 'wiki/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref_name }}
  # Nunca cancela: um push de tag interrompido deixa release sem imagem.
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags desta corrida
        id: meta
        run: |
          set -euo pipefail
          REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            V='${{ github.ref_name }}'; V="${V#v}"
            printf 'tags=%s:%s,%s:latest\n' "$REPO" "$V" "$REPO" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:develop,%s:develop-%s\n' "$REPO" "$REPO" '${{ github.sha }}' >> "$GITHUB_OUTPUT"
          fi
          echo "scan_tag=$REPO:scan-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Constrói e CARREGA local primeiro. O push só acontece depois do portão — publicar e depois
      # escanear inverteria a ordem que dá sentido ao portão.
      - name: Build (local, ainda sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.scan_tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy pela IMAGEM OFICIAL fixada por digest, não por action. É o precedente deste
      # repositório (o `actionlint` é consumido assim, com a razão escrita lá) e evita acrescentar
      # mais uma referência não fixada por SHA ao que o B-083 mede.
      - name: Portão Trivy (CRITICAL + HIGH) antes de publicar
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity CRITICAL,HIGH --exit-code 1 --ignorefile /.trivyignore \
            --scanners vuln '${{ steps.meta.outputs.scan_tag }}'

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reusa o cache do build acima, então não recompila — só publica.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
