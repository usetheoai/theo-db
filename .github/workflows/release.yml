# release — cria a GitHub Release quando uma tag `v*` é empurrada.
#
# O DEFEITO QUE ISTO PREVINE (medido 2026-08-20): NENHUM workflow deste repositório criava release.
# Zero ocorrências de `gh release`, `action-gh-release`, `softprops` ou gatilho `release:` nos nove
# arquivos existentes. A consequência estava visível: `main` em 0.158.0 desde 2026-07-29, com
# 0.159.0 e 0.160.0 escritas no CHANGELOG e nunca cortadas — duas afirmações de versão sem nada
# que as tornasse verificáveis.
#
# RUNNER: `ubuntu-latest`, não o self-hosted. Este repositório é PÚBLICO e runner padrão do GitHub é
# grátis e ilimitado nesse caso; a máquina `theodb-do` é paga, é ÚNICA e é SERIAL. Um release não pode
# esperar atrás da fila de compilação — foi o que aconteceu com o `lint-rust`, medido em 66 a 120
# minutos para um `cargo fmt --check`.
#
# NOTAS vêm do CHANGELOG, não do log de commits. `--generate-notes` derivaria das mensagens; a Regra 6
# deste projeto diz que o CHANGELOG é o contrato escrito para quem consome. Publicar notas que ninguém
# revisou, ao lado de notas que alguém escreveu, é trocar o contrato pelo rascunho.
name: release

on:
  push:
    tags: ["v*"]
  # Para tag já existente cuja release falhou ou nunca foi criada — o caso das retroativas.
  workflow_dispatch:
    inputs:
      tag:
        description: "tag existente (ex.: v0.159.0)"
        required: true
        type: string

permissions:
  contents: write   # criar a release e anexar o corpo; nada além disso

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  # NUNCA cancela: um release em andamento interrompido deixa tag sem release, que é
  # exatamente o estado que este workflow existe para eliminar.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0   # a tag precisa existir localmente para `gh release create` referenciá-la

      - name: A tag aponta para um commit alcançável por `main`?
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$TAG" origin/main; then
            echo "OK: $TAG é ancestral de main"
          else
            echo "::error::$TAG NAO e alcancavel por main. Release so sai de codigo integrado" >&2
            echo "(rules/git-safety.md § 1: main recebe apenas merges de release)" >&2
            exit 1
          fi

      - name: Extrair as notas do CHANGELOG
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # O script falha alto quando a versão não tem seção: uma release de corpo vazio
          # afirmaria que não houve mudança, que é pior que release nenhuma.
          scripts/changelog-section.sh "$TAG" > /tmp/notes.md
          echo "Notas extraidas: $(wc -l < /tmp/notes.md) linhas"

      - name: Criar a release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe — atualizando as notas em vez de duplicar"
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          fi
          gh release view "$TAG" --json url --jq '"publicada: " + .url'
