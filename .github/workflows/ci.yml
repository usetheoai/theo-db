name: CI

# M2 DoD-1: the recall@k benchmark harness is the measurement-first gate. It runs in CI over a
# real ANN-Benchmarks reference dataset (glove-25-angular), alongside the M0 smoke (pgvector) and
# the M2 vectorscale/diskann integration. Every step here is one that has been run locally first.

# FILTRO POSITIVO (não `paths-ignore`) — o runner é ÚNICO e serial, e o `paths-ignore` anterior
# (`.claude/**`, `**/*.md`, `wiki/**`) não excluía quase nada: qualquer commit em `.github/`,
# `knowledge-base/`, `agents/` ou num arquivo de raiz reabria os 10 jobs. Medido em 2026-07-27, o
# commit `3313226` — que tocou SÓ 4 YAMLs de workflow e o CHANGELOG, zero linha de código —
# disparou CI + publish + ci-canary + lint-rust + cassert, cinco runs numa fila serial.
#
# A lista abaixo é derivada do que a esteira de fato lê, não de memória:
#   - `Dockerfile` / `.dockerignore` / `vector/` / `theodb_rs/` — entram na imagem
#     (conferido nos `COPY` do Dockerfile). B-030: o `sql/` de topo e os `*.control` de raiz deixaram
#     de existir — a superfície do produto vive em `theodb_rs/`, e o shim é a unidade `vector/`.
#   - `scripts/`   — smoke.sh, migrate-*.sh
#   - MEDIÇÃO NÃO MORA MAIS AQUI. O harness `benchmarks/` foi removido em `7cd157d` (B-029) e hoje é
#     o repositório irmão `theodb-bench`, projeto INDEPENDENTE que consome o TheoDB como sistema sob
#     teste. Esta esteira guarda a CORRETUDE que vive com o produto (smokes, presença de superfície,
#     regressão upstream, migração, licença); recall, QPS, nDCG e comparação com concorrente são
#     avaliação, e avaliação é do bench. Um `pytest` aqui voltaria a acoplar os dois.
#   - `packaging/` — Dockerfile.regress / .bm25 / .columnar + license-sweep.sh
#   - `Makefile`   — hoje a esteira não o invoca; incluído como seguro barato, porque um gate de
#     correção erra para o lado de rodar demais, nunca de menos
#
# TRADE-OFF ACEITO EXPLICITAMENTE: filtro positivo cria risco de FALSO-VERDE — um diretório novo
# que não entre nesta lista deixa de ser testado em silêncio. Quem adicionar um caminho que a suíte
# passe a exercitar TEM de adicioná-lo aqui. Foi decisão consciente (alternativa conservadora era
# só estender o `paths-ignore`).
#
# Seguro aqui porque este workflow NÃO escuta `tags:` — filtro de path também se aplica a push de
# tag, e um `chore(release)` que só toca CHANGELOG seria filtrado. Ver `publish-image.yml`, que
# escuta tags e por isso NÃO recebeu filtro positivo.
on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   bash scripts/dev-test.sh --lint     # cargo fmt --check + clippy com o baseline
  #   bash scripts/dev-test.sh            # a suite inteira
  #   bash scripts/dev-test.sh lexical    # so o modulo tocado, em segundos
  #
  # A receita estava COPIADA AQUI E EM MAIS SETE cabecalhos, e fazia `cp -r` do codigo para dentro
  # do conteiner — o que nao preserva mtime e fazia o cargo recompilar 363 crates a cada corrida.
  # Medido: `cp -r` 363 recompilacoes / ~8 min, montagem direta **0** / 53s. Detalhe e numeros no
  # cabecalho do script (B-054).
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  workflow_dispatch:
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      # B-030: `Makefile` e `theodb.control` saíram com o umbrella `theodb`, absorvido pelo `theodb_rs`.
      # A superfície SQL que eles construíam agora vive em `theodb_rs/sql/surface/`, já coberta pelo
      # `theodb_rs/**` abaixo. O shim `vector` continua separado e virou unidade autocontida em `vector/`
      # (control + script de instalação juntos), então o `sql/` de topo deixou de existir.
      - 'vector/**'
      - 'theodb_rs/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/ci.yml'
      # Um README dentro de qualquer um dos diretórios acima não muda resultado de teste.
      - '!**/*.md'

  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      # B-030: `Makefile` e `theodb.control` saíram com o umbrella `theodb`, absorvido pelo `theodb_rs`.
      # A superfície SQL que eles construíam agora vive em `theodb_rs/sql/surface/`, já coberta pelo
      # `theodb_rs/**` abaixo. O shim `vector` continua separado e virou unidade autocontida em `vector/`
      # (control + script de instalação juntos), então o `sql/` de topo deixou de existir.
      - 'vector/**'
      - 'theodb_rs/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/ci.yml'
      # Um README dentro de qualquer um dos diretórios acima não muda resultado de teste.
      - '!**/*.md'

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# Menor privilégio. Este workflow não declarava `permissions:` nenhum, então cada job recebia o
# default do repositório para o GITHUB_TOKEN — que numa org configurada como permissiva é
# read/write em conteúdo, issues, packages e deployments. Nada aqui escreve: a esteira só faz
# checkout, builda imagem local (`load: true`) e roda teste. Os workflows que de fato publicam
# (`publish-image.yml`) declaram seus próprios `packages: write` / `id-token: write`.
permissions:
  contents: read

jobs:
  # CONSTRUÍDA UMA VEZ, CONSUMIDA POR TODOS. Antes de 2026-08-20 cada job fazia o seu próprio
  # `docker build` — onze invocações em nove jobs — e NENHUM declarava `needs:`. Como todos partiam
  # ao mesmo tempo, o único produtor de cache (`cache-to`) e os oito consumidores corriam juntos:
  # numa cache fria, isto é, sempre que o `Dockerfile` muda, os nove compilavam Rust + pgrx do zero
  # em paralelo. Medido em 2026-08-20: nove jobs iniciados no mesmo segundo, seis ainda construindo
  # nove minutos depois.
  #
  # O ganho maior não é tempo, é CORRETUDE. Oito builds independentes produzem oito imagens que só se
  # PRESUME idênticas; um único artefato publicado por digest é o mesmo em todos os jobs, e o que um
  # deles reprovar é o que os outros exercitaram.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build da imagem de CI (uma vez, para todos)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: theo-db:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ARTEFATO, e não registry, por medição. A primeira versão deste job publicava em
      # `ghcr.io/usetheoai/theo-db:ci-<sha>` e foi recusada com `denied: permission_denied:
      # read_package`, mesmo com `packages: write` declarado — a recusa é da política do registry,
      # não do workflow. E o [[B-082]] já registrava que a publicação no GHCR **nunca funcionou**
      # neste repositório: 8 de 8 execuções do `publish-image.yml` em falha desde 2026-07-29.
      # Apostar a esteira inteira num mecanismo comprovadamente quebrado aqui seria trocar onze
      # builds redundantes por zero builds e nenhum teste.
      #
      # O artefato entrega a mesma garantia que motivou a mudança: UM artefato, os mesmos bytes em
      # todo job. `zstd` porque o default `gzip` do upload-artifact recomprime o que já é camada
      # comprimida, gastando minuto sem ganhar espaço.
      - name: Salvar a imagem
        run: docker save theo-db:ci | zstd -T0 -3 -o /tmp/theodb-ci.tar.zst

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theodb-ci-image
          path: /tmp/theodb-ci.tar.zst
          retention-days: 1
          compression-level: 0

  pgvector-compat:
    needs: build
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: grátis e ilimitado, e sobretudo PARALELO —
    # a máquina paga era ÚNICA e SERIAL, e os dez workflows do mesmo push enfileiravam.
    #
    # DISCO: MEDIDO, não mais suposto. A dúvida era `theodb_rs/target` medir 13 GB contra o disco do
    # runner padrão. Corrida de 2026-08-20: a `Rust test suite` (que constrói o estágio builder e roda
    # a suíte dentro do contêiner) passou em **19 minutos**, e NENHUM job falhou por espaço. A receita
    # de remover toolchains pré-instaladas não foi necessária — e não entra sem número que a peça.
    runs-on: ubuntu-latest
    # Sem timeout, o default do GitHub é 360 min — num runner SERIAL compartilhado por 5 repos,
    # um job pendurado sequestra a fila de todos por 6 horas. Os valores aqui são folga sobre a
    # duração observada (build de imagem + asserções), na mesma faixa dos jobs vizinhos que já
    # declaravam timeout (pg-regression 25, hybrid-search 20).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carregar a imagem construída uma vez pelo job `build`
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theodb-ci-image
          path: /tmp

      - name: Carregar no daemon
        run: |
          zstd -d -c /tmp/theodb-ci.tar.zst | docker load
          docker tag theo-db:ci theo-db:dev
      - name: Bootstrap de uma app pgvector contra a imagem (o fluxo do README)
        run: |
          set -euo pipefail
          docker rm -f theodb_compat 2>/dev/null || true
          docker run -d --name theodb_compat -e POSTGRES_PASSWORD=postgres theo-db:dev
          for _ in $(seq 1 60); do
            docker exec theodb_compat pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done

          q() { docker exec theodb_compat psql -U postgres -v ON_ERROR_STOP=1 -tAc "$1"; }

          # (1) o comando que TODA app pgvector emite no bootstrap — SEM cascade, como drizzle/alembic.
          #     Um banco novo precisa herdar a dependência de template1 (o fix do #181).
          docker exec theodb_compat psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE app_compat"
          docker exec theodb_compat psql -U postgres -d app_compat -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

          # (2) a app cria tabela e ÍNDICES com a sintaxe pgvector (o fix do #182).
          docker exec theodb_compat psql -U postgres -d app_compat -v ON_ERROR_STOP=1 -c "
            CREATE TABLE items (id int, embedding vector(3));
            INSERT INTO items VALUES (1,'[1,1,1]'), (2,'[5,5,5]');
            CREATE INDEX i_cos ON items USING hnsw (embedding vector_cosine_ops);
            CREATE INDEX i_l2  ON items USING hnsw (embedding vector_l2_ops);
            CREATE INDEX i_ip  ON items USING hnsw (embedding vector_ip_ops);"

          # (3) asserções — resultado CORRETO, não apenas "não deu erro".
          DIST=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT round((embedding <-> '[2,2,2]'::vector)::numeric,4) FROM items WHERE id=1;")
          [ "$DIST" = "1.7321" ] || { echo "::error::distancia $DIST != 1.7321 (raiz de 3)"; exit 1; }

          IDX=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT count(*) FROM pg_indexes WHERE tablename='items' AND indexdef LIKE '%USING hnsw%';")
          [ "$IDX" = "3" ] || { echo "::error::indices USING hnsw = $IDX (esperado 3)"; exit 1; }

          # (4) o AM alias compartilha o MESMO handler own-code — nao e uma 2a implementacao.
          AMH=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT count(*) FROM pg_am a JOIN pg_am b ON a.amhandler=b.amhandler WHERE a.amname='hnsw' AND b.amname='theodb_hnsw';")
          [ "$AMH" = "1" ] || { echo "::error::AM hnsw nao compartilha o handler do theodb_hnsw"; exit 1; }

          # (5) honestidade — o \dx declara que a implementacao NAO e o pgvector.
          docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT obj_description(oid,'pg_extension') FROM pg_extension WHERE extname='vector';" \
            | grep -q "NOT by pgvector" || { echo "::error::comment nao declara own-code"; exit 1; }

          echo "PGVECTOR_COMPAT_OK — bootstrap sem cascade, 3 indices USING hnsw, dist=$DIST, handler compartilhado"

      - name: Cleanup
        if: always()
        run: docker rm -f theodb_compat 2>/dev/null || true

  image-guards:
    needs: build
    # Builds the TheoDB image, proves M0 (smoke) + M2 vectorscale, then runs the benchmark harness
    # in CI over the real glove-25-angular reference dataset (DoD-1) + the integration suite.
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: grátis e ilimitado, e sobretudo PARALELO —
    # a máquina paga era ÚNICA e SERIAL, e os dez workflows do mesmo push enfileiravam.
    #
    # DISCO: MEDIDO, não mais suposto. A dúvida era `theodb_rs/target` medir 13 GB contra o disco do
    # runner padrão. Corrida de 2026-08-20: a `Rust test suite` (que constrói o estágio builder e roda
    # a suíte dentro do contêiner) passou em **19 minutos**, e NENHUM job falhou por espaço. A receita
    # de remover toolchains pré-instaladas não foi necessária — e não entra sem número que a peça.
    runs-on: ubuntu-latest
    # O job mais caro da esteira: constrói a imagem e publica o cache buildx que os outros leem.
    # ~80% do wall-clock da esteira (27,9 min medidos em 2026-07-27, ver comentário no step). 45 min
    # é ~2x o observado — folga para variação de download do dataset sem virar refém de um hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carregar a imagem construída uma vez pelo job `build`
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theodb-ci-image
          path: /tmp

      - name: Carregar no daemon
        run: |
          zstd -d -c /tmp/theodb-ci.tar.zst | docker load
          docker tag theo-db:ci theo-db:dev
      - name: Start TheoDB
        run: |
          # EPHEMERAL host port (`-p 5432`, NOT `-p 5432:5432`). A fixed host port made every job
          # in this workflow compete for one port on the runner: a run cancelled by
          # `concurrency.cancel-in-progress` skips its Teardown, leaks the container, and from then
          # on EVERY subsequent run dies with "Bind for 0.0.0.0:5432 failed: port is already
          # allocated" — self-perpetuating until someone cleans the host by hand. It is also
          # structurally incompatible with running these jobs in parallel. Docker picks a free port;
          # PGPORT is resolved below and exported for every later step via $GITHUB_ENV.
          docker rm -f theo-db-ci 2>/dev/null || true
          # host-gateway lets the in-container theodb.embed() reach the host embedding server (DoD-3 test)
          # M134/#117 fecharam a classe de SSRF em ai._chat: o guard recusa endpoints que resolvem
          # para loopback/privado/link-local. Estas suites usam um STUB OFFLINE no host
          # (host.docker.internal / 127.0.0.1) justamente para serem deterministicas e nao chamar API
          # externa — entao o guard as bloqueia, com 20 de 33 testes falhando. A saida e o escape hatch
          # que o proprio erro instrui: `theodb.egress_allowlist`, um GUC Suset (operator-only, nunca
          # settable pelo caller). A CI e o operador deste cluster de teste. O guard permanece ativo para
          # todo o resto, e a distribuicao continua com allowlist VAZIO — isto nao afrouxa producao.
          docker run -d --name theo-db-ci --add-host=host.docker.internal:host-gateway \
            -e POSTGRES_PASSWORD=postgres -p 5432 theo-db:ci \
            -c theodb.egress_allowlist=host.docker.internal,127.0.0.1
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-ci)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-ci | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-ci 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-ci (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"

      - name: Smoke (M0 — pgvector)
        run: bash scripts/smoke.sh

      - name: CA bundle present (theodb.embed HTTPS cloud providers — regression guard)
        run: docker exec theo-db-ci test -f /etc/ssl/certs/ca-certificates.crt

      - name: Lakehouse own-code + pg_duckdb REMOVIDO (M143 regression guard)
        run: |
          # M143/ADR-0057: pg_duckdb removido por completo; o lakehouse é own-code (theodb_rs, DataFusion/Arrow).
          # Falha se pg_duckdb reaparecer, E prova o fluxo M62 own-code (htap_refresh→olap) sem DuckDB.
          n="$(docker exec theo-db-ci psql -U postgres -tAc "SELECT count(*) FROM pg_extension WHERE extname='pg_duckdb'")"
          [ "$n" = "0" ] || { echo "FAIL: pg_duckdb presente (esperado 0, got $n)"; exit 1; }
          docker exec theo-db-ci psql -U postgres -c "CREATE TABLE lh(category text, amount float8); INSERT INTO lh VALUES ('a',10),('a',20),('b',5)" >/dev/null
          docker exec theo-db-ci psql -U postgres -tAc "SELECT theodb.htap_refresh('lh'::regclass)" >/dev/null
          rows="$(docker exec theo-db-ci psql -U postgres -tAc "SELECT category||'|'||c||'|'||a FROM theodb.olap('lh'::regclass) ORDER BY category")"
          # `if !` explícito em vez de `A && B || C`: naquela forma, se A falhasse o shell ainda
          # avaliava C, e um `exit` dentro de C mascarava qual das duas asserções quebrou (SC2015).
          if ! echo "$rows" | grep -q "^a|2|15" || ! echo "$rows" | grep -q "^b|1|5"; then
            echo "FAIL: lakehouse own-code M62 (got: $rows)"
            exit 1
          fi
          echo "M143 lakehouse own-code OK (sem pg_duckdb)"

      - name: Teardown
        if: always()
        run: docker rm -f theo-db-ci || true

  migration-smoke:
    needs: build
    # M3 DoD-1/DoD-2: standard pg_dump/pg_restore migration from a vanilla pgvector source into TheoDB,
    # asserting data + indexes are preserved. Every step here has been run locally first.
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: grátis e ilimitado, e sobretudo PARALELO —
    # a máquina paga era ÚNICA e SERIAL, e os dez workflows do mesmo push enfileiravam.
    #
    # DISCO: MEDIDO, não mais suposto. A dúvida era `theodb_rs/target` medir 13 GB contra o disco do
    # runner padrão. Corrida de 2026-08-20: a `Rust test suite` (que constrói o estágio builder e roda
    # a suíte dentro do contêiner) passou em **19 minutos**, e NENHUM job falhou por espaço. A receita
    # de remover toolchains pré-instaladas não foi necessária — e não entra sem número que a peça.
    runs-on: ubuntu-latest
    # Build + dois containers (pgvector origem, TheoDB destino) + pg_dump/pg_restore. Mesma faixa
    # do `pg-regression` (25), que também sobe container e roda suíte externa.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Carregar a imagem construída uma vez pelo job `build`
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theodb-ci-image
          path: /tmp

      - name: Carregar no daemon
        run: |
          zstd -d -c /tmp/theodb-ci.tar.zst | docker load
          docker tag theo-db:ci theo-db:dev
      - name: Start source (vanilla pgvector, pinned by digest) + target (TheoDB)
        run: |
          # pinned by digest for reproducibility, consistent with the repo's supply-chain policy
          docker run -d --name m3-src -e POSTGRES_PASSWORD=postgres \
            pgvector/pgvector@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
          docker run -d --name m3-dst -e POSTGRES_PASSWORD=postgres theo-db:dev

      - name: Guide ↔ smoke consistency (doc-check)
        run: bash scripts/migrate-doc-check.sh

      - name: Migration smoke (data + indexes preserved; waits for readiness internally)
        run: bash scripts/migrate-smoke.sh

      - name: Self-test (checksum assert is not theatre)
        run: bash scripts/migrate-smoke-selftest.sh

      - name: Teardown
        if: always()
        run: docker rm -f m3-src m3-dst || true

  pg-regression:
    needs: build
    timeout-minutes: 25
    # M1 DoD-1: the upstream PostgreSQL 17 regression suite passes 100% on the TheoDB distribution.
    # Throwaway runner (FROM theo-db:dev) builds pg_regress from REL_17_10 and runs `make installcheck`.
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: grátis e ilimitado, e sobretudo PARALELO —
    # a máquina paga era ÚNICA e SERIAL, e os dez workflows do mesmo push enfileiravam.
    #
    # DISCO: MEDIDO, não mais suposto. A dúvida era `theodb_rs/target` medir 13 GB contra o disco do
    # runner padrão. Corrida de 2026-08-20: a `Rust test suite` (que constrói o estágio builder e roda
    # a suíte dentro do contêiner) passou em **19 minutos**, e NENHUM job falhou por espaço. A receita
    # de remover toolchains pré-instaladas não foi necessária — e não entra sem número que a peça.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Carregar a imagem construída uma vez pelo job `build`
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theodb-ci-image
          path: /tmp

      - name: Carregar no daemon
        run: |
          zstd -d -c /tmp/theodb-ci.tar.zst | docker load
          docker tag theo-db:ci theo-db:dev
      - name: Build regression runner (pg_regress + regress.so, tag DERIVADO do engine)
        run: |
          set -euo pipefail
          # O tag do fonte da suíte segue o engine, nunca uma constante nossa: a imagem base
          # `postgres:18-bookworm` avança de patch sozinha, e em 2026-08-20 foi de 18.4 para 18.6.
          VER=$(docker run --rm theo-db:dev postgres --version | grep -oE '[0-9]+\.[0-9]+' | head -1)
          [ -n "$VER" ] || { echo "::error::não consegui ler a versão do engine em theo-db:dev" >&2; exit 1; }
          PG_TAG="REL_${VER//./_}"
          echo "engine $VER -> source tag $PG_TAG"
          docker build --build-arg "PG_TAG=$PG_TAG" -f packaging/Dockerfile.regress -t theo-db-regress .

      - name: Upstream PG17 regression suite (100% must pass)
        run: docker run --rm theo-db-regress

