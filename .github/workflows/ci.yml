name: CI

# M2 DoD-1: the recall@k benchmark harness is the measurement-first gate. It runs in CI over a
# real ANN-Benchmarks reference dataset (glove-25-angular), alongside the M0 smoke (pgvector) and
# the M2 vectorscale/diskann integration. Every step here is one that has been run locally first.

on:
  push:
    branches: [develop, main]
    # #187 — o runner é ÚNICO e serial: cada push dispara ~14 jobs de ~45min (≈10h de fila).
    # Mudanças só de documentação/artefatos de agente não exercitam código e não podem consumir
    # essa capacidade. Mesmo padrão do theo-memory/theo-rag.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [develop, main]
    # Mesma razão do `push` acima: um PR cujo diff é só documentação não pode consumir ~14 jobs de
    # ~45min do runner único. Sem isto, o gate de `pull_request` reabria toda a esteira para um commit
    # de CHANGELOG (observado no PR #189).
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'docs/**'

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # #181/#182 — GATE de compatibilidade pgvector. Roda contra a IMAGEM (o artefato que o usuário
  # realmente baixa), não contra um cluster montado à mão: é o caminho do README, e foi justamente a
  # ausência desse caminho no CI que deixou passar (a) `CREATE EXTENSION vector` inexistente e (b) o AM
  # `hnsw` / opclasses `vector_*_ops` ausentes — dois bugs que só apareceram ao apontar uma app real.
  pgvector-compat:
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bootstrap de uma app pgvector contra a imagem (o fluxo do README)
        run: |
          set -euo pipefail
          docker rm -f theodb_compat 2>/dev/null || true
          docker run -d --name theodb_compat -e POSTGRES_PASSWORD=postgres theo-db:dev
          for i in $(seq 1 60); do
            docker exec theodb_compat pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done

          q() { docker exec theodb_compat psql -U postgres -v ON_ERROR_STOP=1 -tAc "$1"; }

          # (1) o comando que TODA app pgvector emite no bootstrap — SEM cascade, como drizzle/alembic.
          #     Um banco novo precisa herdar a dependência de template1 (o fix do #181).
          docker exec theodb_compat psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE app_compat"
          docker exec theodb_compat psql -U postgres -d app_compat -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

          # (2) a app cria tabela e ÍNDICES com a sintaxe pgvector (o fix do #182).
          docker exec theodb_compat psql -U postgres -d app_compat -v ON_ERROR_STOP=1 -c "
            CREATE TABLE items (id int, embedding vector(3));
            INSERT INTO items VALUES (1,'[1,1,1]'), (2,'[5,5,5]');
            CREATE INDEX i_cos ON items USING hnsw (embedding vector_cosine_ops);
            CREATE INDEX i_l2  ON items USING hnsw (embedding vector_l2_ops);
            CREATE INDEX i_ip  ON items USING hnsw (embedding vector_ip_ops);"

          # (3) asserções — resultado CORRETO, não apenas "não deu erro".
          DIST=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT round((embedding <-> '[2,2,2]'::vector)::numeric,4) FROM items WHERE id=1;")
          [ "$DIST" = "1.7321" ] || { echo "::error::distancia $DIST != 1.7321 (raiz de 3)"; exit 1; }

          IDX=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT count(*) FROM pg_indexes WHERE tablename='items' AND indexdef LIKE '%USING hnsw%';")
          [ "$IDX" = "3" ] || { echo "::error::indices USING hnsw = $IDX (esperado 3)"; exit 1; }

          # (4) o AM alias compartilha o MESMO handler own-code — nao e uma 2a implementacao.
          AMH=$(docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT count(*) FROM pg_am a JOIN pg_am b ON a.amhandler=b.amhandler WHERE a.amname='hnsw' AND b.amname='theodb_hnsw';")
          [ "$AMH" = "1" ] || { echo "::error::AM hnsw nao compartilha o handler do theodb_hnsw"; exit 1; }

          # (5) honestidade — o \dx declara que a implementacao NAO e o pgvector.
          docker exec theodb_compat psql -U postgres -d app_compat -tAc \
            "SELECT obj_description(oid,'pg_extension') FROM pg_extension WHERE extname='vector';" \
            | grep -q "NOT by pgvector" || { echo "::error::comment nao declara own-code"; exit 1; }

          echo "PGVECTOR_COMPAT_OK — bootstrap sem cascade, 3 indices USING hnsw, dist=$DIST, handler compartilhado"

      - name: Cleanup
        if: always()
        run: docker rm -f theodb_compat 2>/dev/null || true

  harness-unit:
    # Fast, container-free: the recall math, ground-truth, metrics and HDF5 loader (DoD-1 gate logic).
    runs-on: [self-hosted, theodb-do]
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness deps
        run: pip install -r requirements.txt ruff vulture
      - name: Lint (ruff)
        run: ruff check theodb_bench tests
      - name: Dead-code (vulture)
        run: vulture theodb_bench --min-confidence 80
      - name: Unit tests (no container)
        run: pytest -m "not integration" -q

  image-and-bench:
    # Builds the TheoDB image, proves M0 (smoke) + M2 vectorscale, then runs the benchmark harness
    # in CI over the real glove-25-angular reference dataset (DoD-1) + the integration suite.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB image (pgvector + pgvectorscale)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start TheoDB
        run: |
          # EPHEMERAL host port (`-p 5432`, NOT `-p 5432:5432`). A fixed host port made every job
          # in this workflow compete for one port on the runner: a run cancelled by
          # `concurrency.cancel-in-progress` skips its Teardown, leaks the container, and from then
          # on EVERY subsequent run dies with "Bind for 0.0.0.0:5432 failed: port is already
          # allocated" — self-perpetuating until someone cleans the host by hand. It is also
          # structurally incompatible with running these jobs in parallel. Docker picks a free port;
          # PGPORT is resolved below and exported for every later step via $GITHUB_ENV.
          docker rm -f theo-db-ci 2>/dev/null || true
          # host-gateway lets the in-container theodb.embed() reach the host embedding server (DoD-3 test)
          # M134/#117 fecharam a classe de SSRF em ai._chat: o guard recusa endpoints que resolvem
          # para loopback/privado/link-local. Estas suites usam um STUB OFFLINE no host
          # (host.docker.internal / 127.0.0.1) justamente para serem deterministicas e nao chamar API
          # externa — entao o guard as bloqueia, com 20 de 33 testes falhando. A saida e o escape hatch
          # que o proprio erro instrui: `theodb.egress_allowlist`, um GUC Suset (operator-only, nunca
          # settable pelo caller). A CI e o operador deste cluster de teste. O guard permanece ativo para
          # todo o resto, e a distribuicao continua com allowlist VAZIO — isto nao afrouxa producao.
          docker run -d --name theo-db-ci --add-host=host.docker.internal:host-gateway \
            -e POSTGRES_PASSWORD=postgres -p 5432 theo-db:ci \
            -c theodb.egress_allowlist=host.docker.internal,127.0.0.1
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-ci)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-ci | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-ci 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-ci (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"

      - name: Smoke (M0 — pgvector)
        run: bash scripts/smoke.sh

      - name: CA bundle present (theodb.embed HTTPS cloud providers — regression guard)
        run: docker exec theo-db-ci test -f /etc/ssl/certs/ca-certificates.crt

      - name: Lakehouse own-code + pg_duckdb REMOVIDO (M143 regression guard)
        run: |
          # M143/ADR-0057: pg_duckdb removido por completo; o lakehouse é own-code (theodb_rs, DataFusion/Arrow).
          # Falha se pg_duckdb reaparecer, E prova o fluxo M62 own-code (htap_refresh→olap) sem DuckDB.
          n="$(docker exec theo-db-ci psql -U postgres -tAc "SELECT count(*) FROM pg_extension WHERE extname='pg_duckdb'")"
          [ "$n" = "0" ] || { echo "FAIL: pg_duckdb presente (esperado 0, got $n)"; exit 1; }
          docker exec theo-db-ci psql -U postgres -c "CREATE TABLE lh(category text, amount float8); INSERT INTO lh VALUES ('a',10),('a',20),('b',5)" >/dev/null
          docker exec theo-db-ci psql -U postgres -tAc "SELECT theodb.htap_refresh('lh'::regclass)" >/dev/null
          rows="$(docker exec theo-db-ci psql -U postgres -tAc "SELECT category||'|'||c||'|'||a FROM theodb.olap('lh'::regclass) ORDER BY category")"
          echo "$rows" | grep -q "^a|2|15" && echo "$rows" | grep -q "^b|1|5" \
            || { echo "FAIL: lakehouse own-code M62 (got: $rows)"; exit 1; }
          echo "M143 lakehouse own-code OK (sem pg_duckdb)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt

      - name: Cache ANN-Benchmarks dataset
        id: cache-glove
        uses: actions/cache@v4
        with:
          path: benchmarks/.datasets/glove-25-angular.hdf5
          key: glove-25-angular-hdf5

      - name: Fetch glove-25-angular (if not cached)
        if: steps.cache-glove.outputs.cache-hit != 'true'
        working-directory: benchmarks
        run: |
          mkdir -p .datasets
          curl -sSL -o .datasets/glove-25-angular.hdf5 http://ann-benchmarks.com/glove-25-angular.hdf5
          echo "51004cb0ae962159f0db507a51fec2b395de14b166f55976c89f16bd2f8b6391  .datasets/glove-25-angular.hdf5" | sha256sum -c -

      - name: Benchmark gate — harness on real reference dataset (HNSW; capped for CI time)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        # HNSW only + small subset keeps CI fast (a full diskann build on 50k takes ~2 min); the
        # decision-grade diskann sweep is run out-of-CI and committed under docs/benchmarks/.
        run: |
          python -m theodb_bench --hdf5 .datasets/glove-25-angular.hdf5 --index hnsw \
            --metric cosine --seed 42 --n 10000 --n-queries 200 --k 10 --runs 2 --out /tmp/bench
          python - <<'PY'
          import glob, json, sys
          f = sorted(glob.glob("/tmp/bench/*glove-25-angular*.json"))[-1]
          d = json.load(open(f))
          r = max(x["recall_at_k"] for x in d["results"])
          print(f"CI benchmark recall@10 (HNSW, glove-25, n=10k): {r:.4f}")
          # HNSW on a real clustered dataset must recall high — guards against a silently broken gate.
          sys.exit(0 if r >= 0.90 else 1)
          PY

      - name: Integration tests (vectorscale / diskann against the container)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration -q

      - name: Teardown
        if: always()
        run: docker rm -f theo-db-ci || true

  migration-smoke:
    # M3 DoD-1/DoD-2: standard pg_dump/pg_restore migration from a vanilla pgvector source into TheoDB,
    # asserting data + indexes are preserved. Every step here has been run locally first.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start source (vanilla pgvector, pinned by digest) + target (TheoDB)
        run: |
          # pinned by digest for reproducibility, consistent with the repo's supply-chain policy
          docker run -d --name m3-src -e POSTGRES_PASSWORD=postgres \
            pgvector/pgvector@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
          docker run -d --name m3-dst -e POSTGRES_PASSWORD=postgres theo-db:dev

      - name: Guide ↔ smoke consistency (doc-check)
        run: bash scripts/migrate-doc-check.sh

      - name: Migration smoke (data + indexes preserved; waits for readiness internally)
        run: bash scripts/migrate-smoke.sh

      - name: Self-test (checksum assert is not theatre)
        run: bash scripts/migrate-smoke-selftest.sh

      - name: Teardown
        if: always()
        run: docker rm -f m3-src m3-dst || true

  pg-regression:
    timeout-minutes: 25
    # M1 DoD-1: the upstream PostgreSQL 17 regression suite passes 100% on the TheoDB distribution.
    # Throwaway runner (FROM theo-db:dev) builds pg_regress from REL_17_10 and runs `make installcheck`.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB base image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build regression runner (pg_regress + regress.so from REL_17_10)
        run: docker build -f packaging/Dockerfile.regress -t theo-db-regress .

      - name: Upstream PG17 regression suite (100% must pass)
        run: docker run --rm theo-db-regress

  hybrid-search:
    timeout-minutes: 20
    # M7-S1: hybrid search (FTS + vector + RRF) — contract tests + smoke + capped BEIR-style eval.
    # Every step here has been run locally first (deterministic lexical embedder; no external endpoint).
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start TheoDB
        run: |
          # Ephemeral host port — rationale in the image-and-bench "Start TheoDB" step.
          docker rm -f theo-db-hyb 2>/dev/null || true
          docker run -d --name theo-db-hyb -e POSTGRES_PASSWORD=postgres -p 5432 theo-db:dev
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-hyb)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-hyb | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-hyb 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-hyb (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"

      - name: Hybrid smoke (ai.hybrid_search_rrf golden top-k assertion)
        run: bash scripts/smoke.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt

      - name: Hybrid unit tests (RRF fusion + nDCG/Recall math + BEIR loader)
        working-directory: benchmarks
        run: pytest -m "not integration" tests/test_hybrid.py -q

      - name: Hybrid contract + 3-retriever eval (against the container)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_integration.py -k 'hybrid or retrievers' -q

      - name: Teardown
        if: always()
        run: docker rm -f theo-db-hyb || true

  ai-sql:
    timeout-minutes: 20
    # M7-S3: generative ai.* functions — offline deterministic contract suite (stub server; NO external API).
    # The real-OpenAI test is opt-in and runs out-of-CI (key from gitignored .env). Run locally first.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start TheoDB (host-gateway so the in-DB function reaches the host stub)
        run: |
          # Ephemeral host port — rationale in the image-and-bench "Start TheoDB" step.
          docker rm -f theo-db-ai 2>/dev/null || true
          # M134/#117 fecharam a classe de SSRF em ai._chat: o guard recusa endpoints que resolvem
          # para loopback/privado/link-local. Estas suites usam um STUB OFFLINE no host
          # (host.docker.internal / 127.0.0.1) justamente para serem deterministicas e nao chamar API
          # externa — entao o guard as bloqueia, com 20 de 33 testes falhando. A saida e o escape hatch
          # que o proprio erro instrui: `theodb.egress_allowlist`, um GUC Suset (operator-only, nunca
          # settable pelo caller). A CI e o operador deste cluster de teste. O guard permanece ativo para
          # todo o resto, e a distribuicao continua com allowlist VAZIO — isto nao afrouxa producao.
          docker run -d --name theo-db-ai --add-host=host.docker.internal:host-gateway \
            -e POSTGRES_PASSWORD=postgres -p 5432 theo-db:dev \
            -c theodb.egress_allowlist=host.docker.internal,127.0.0.1
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-ai)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-ai | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-ai 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-ai (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"

      - name: AI presence smoke (functions present + non-PUBLIC, no network)
        run: bash scripts/smoke.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt

      - name: AI generative contract suite (offline stub — deterministic, no external API)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_ai_sql.py -k 'not real' -q

      - name: Teardown
        if: always()
        run: docker rm -f theo-db-ai || true

  bm25-measure:
    timeout-minutes: 25
    # M7-S2: permissive BM25 (pg_textsearch) — build the throwaway image + MEASURE recall vs ts_rank_cd.
    # measurement-first (ADR 0002/0003): pg_textsearch is NOT in the shipped image; this job builds it only to
    # functionally prove + measure BM25. Deterministic synthetic fixture; no external API. Run locally first.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TheoDB base image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: License sweep — BM25 candidates permissive/barred verdict (reproducible, ADR 0003)
        run: bash packaging/license-sweep.sh

      - name: Build throwaway BM25 image (pg_textsearch v1.3.1, PostgreSQL License)
        run: docker build -f packaging/Dockerfile.bm25 -t theo-db-bm25 .

      - name: Start BM25 image (shared_preload_libraries=pg_textsearch)
        run: |
          # Ephemeral host port — rationale in the image-and-bench "Start TheoDB" step.
          docker rm -f theo-db-bm25c 2>/dev/null || true
          docker run -d --name theo-db-bm25c -e POSTGRES_PASSWORD=postgres -p 5432 \
            theo-db-bm25 -c shared_preload_libraries=pg_textsearch
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-bm25c)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-bm25c | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-bm25c 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-bm25c (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt

      - name: BM25 recall measurement (pg_textsearch vs ts_rank_cd, against the real build)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_bm25.py -q

      - name: Teardown
        if: always()
        run: docker rm -f theo-db-bm25c || true

  nl-sql:
    timeout-minutes: 20
    # M7-S4: safe NL→SQL (anti-prompt-injection) — offline deterministic injection suite (stub; NO external API).
    # The stub "complies" with each injection so the test proves the GUARDS (L2 validation / L3 read-only
    # sandbox 25006) catch it. Run locally first.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build TheoDB image (cache from image-and-bench)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: theo-db:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start TheoDB (host-gateway so the in-DB function reaches the host stub)
        run: |
          # Ephemeral host port — rationale in the image-and-bench "Start TheoDB" step.
          docker rm -f theo-db-nl 2>/dev/null || true
          # M134/#117 fecharam a classe de SSRF em ai._chat: o guard recusa endpoints que resolvem
          # para loopback/privado/link-local. Estas suites usam um STUB OFFLINE no host
          # (host.docker.internal / 127.0.0.1) justamente para serem deterministicas e nao chamar API
          # externa — entao o guard as bloqueia, com 20 de 33 testes falhando. A saida e o escape hatch
          # que o proprio erro instrui: `theodb.egress_allowlist`, um GUC Suset (operator-only, nunca
          # settable pelo caller). A CI e o operador deste cluster de teste. O guard permanece ativo para
          # todo o resto, e a distribuicao continua com allowlist VAZIO — isto nao afrouxa producao.
          docker run -d --name theo-db-nl --add-host=host.docker.internal:host-gateway \
            -e POSTGRES_PASSWORD=postgres -p 5432 theo-db:dev \
            -c theodb.egress_allowlist=host.docker.internal,127.0.0.1
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' theo-db-nl)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' theo-db-nl | grep -q healthy
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-nl 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-nl (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"
      - name: NL→SQL presence smoke (functions present + non-PUBLIC, no network)
        run: bash scripts/smoke.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt
      - name: NL→SQL anti-prompt-injection suite (offline stub — proves the guards catch injections)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_nl_sql.py -q
      - name: S3 ai.* no-regression (the stub changed)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_ai_sql.py -k 'not real' -q
      - name: Teardown
        if: always()
        run: docker rm -f theo-db-nl || true

  columnar-measure:
    timeout-minutes: 20
    # M6: columnar/HTAP (pg_mooncake) — prove + measure the columnstore mirror vs row-store on the canonical
    # pg_mooncake distribution (MIT). Captures the DuckDBScan-vs-SeqScan plan choice (DoD-2). Run locally first.
    runs-on: [self-hosted, theodb-do]
    steps:
      - uses: actions/checkout@v4
      - name: License sweep — columnar candidates permissive verdict (reproducible)
        run: bash packaging/license-sweep.sh || true   # § (a)/(b) need the theo-db image; § (c)/(e) curl-only verdicts always print
      - name: Build throwaway columnar image (canonical pg_mooncake distribution, MIT)
        run: docker build -f packaging/Dockerfile.columnar -t theo-db-columnar .
      - name: Start columnar image
        run: |
          # Ephemeral host port — rationale in the image-and-bench "Start TheoDB" step.
          docker rm -f theo-db-col 2>/dev/null || true
          docker run -d --name theo-db-col -e POSTGRES_PASSWORD=postgres -p 5432 theo-db-columnar
          for i in $(seq 1 40); do docker exec theo-db-col pg_isready -U postgres -q && break; sleep 2; done
          docker exec theo-db-col pg_isready -U postgres -q
          # Validated, never assumed: consumers read `${PGPORT:-5432}`, so an EMPTY value does not
          # fail — it silently falls back to 5432, where nothing listens once the port is ephemeral.
          # That turns a resolution bug into a baffling "connection refused" three steps later.
          port="$(docker port theo-db-col 5432/tcp | head -1 | sed 's/.*://')"
          case "$port" in ''|*[!0-9]*) echo "::error::PGPORT resolution failed for theo-db-col (got: '$port')"; exit 1;; esac
          echo "PGPORT=$port" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness deps
        working-directory: benchmarks
        run: pip install -r requirements.txt
      - name: Columnar measurement (mirror vs row + DuckDBScan plan, DoD-1/DoD-2)
        working-directory: benchmarks
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: pytest -m integration tests/test_columnar.py -q
      - name: Teardown
        if: always()
        run: docker rm -f theo-db-col || true
