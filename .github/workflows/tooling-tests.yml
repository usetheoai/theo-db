# tooling-tests — as suites Python do ferramental sob `.claude/`.
#
# O DEFEITO QUE ISTO PREVINE (medido 2026-08-20, B-090). Existem **94 arquivos de teste** sob
# `.claude/` e NENHUM workflow os rodava: `grep -rn "pytest" .github/workflows/*.yml` devolvia um
# comentario e nenhuma invocacao, e as tres ocorrencias de `.claude/**` nos workflows eram
# `paths-ignore` — exclusoes, nao inclusoes.
#
# O que fica sem gate quando isso falta nao e periferico: sao os checadores de plano, o portao do
# backlog, o gate de CHANGELOG e os scripts de implementacao. Ou seja, o codigo que decide se o
# trabalho deste repositorio passa nao tinha portao nenhum olhando por ele. E o mesmo argumento do
# B-052 — um portao que nao olha um codigo e indistinguivel de um portao que aprova aquele codigo —
# aplicado um diretorio adiante.
#
# A DECISAO DE RODAR AQUI, escrita porque ha argumento legitimo do outro lado. `.claude/` e um
# checkout do kit `squad`, e da para sustentar que o dono do teste e o kit. O contra-argumento
# venceu por duas razoes: o diretorio esta VERSIONADO neste repositorio, entao uma quebra chega aqui
# primeiro; e os consertos feitos aqui nao vao ao kit por decisao do owner
# (`.claude/rules/README.md § Consertos que vivem so aqui`), o que torna este o unico lugar onde
# eles podem ser verificados.
#
# CUSTO MEDIDO, nao estimado: a suite inteira leva **45 s** (`run_slice_tests.sh`, 31 slices, 2026-08-20).
# Os workflows pesados deste repositorio levam de 28 a 58 min. O acrescimo e desprezivel, e e por
# isso que a decisao foi facil — se custasse como os outros, ela mereceria o mesmo ADR que o B-052.
name: tooling-tests

on:
  # Mesma forma que o B-052/ADR-0062 estabeleceu: o portao olha ANTES do merge, e `push` fica em
  # `main` como verificacao pos-release.
  pull_request:
    branches: [develop, main]
    paths:
      - '.claude/skills/**'
      - '.claude/scripts/**'
      - '.github/workflows/tooling-tests.yml'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/scripts/**'
      - '.github/workflows/tooling-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  slices:
    runs-on: ubuntu-latest
    # 45 s medidos; 10 min e folga para runner frio, nao estimativa do trabalho.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Instalar pytest
        run: python -m pip install --quiet --upgrade pip pytest

      # `run_slice_tests.sh` roda UM processo pytest por slice, de proposito: as 31 slices sao
      # import-isoladas e varias trazem modulos com o MESMO basename e conteudo diferente. Um
      # `pytest .claude/skills/` largo colide e reporta falha que nao existe — o cabecalho do script
      # explica isso, e e por essa razao que o workflow nao invoca pytest diretamente.
      - name: Suites das skills (uma por processo)
        run: bash .claude/scripts/run_slice_tests.sh

      - name: Xrefs das regras e skills
        run: python3 .claude/scripts/check_xrefs.py

      - name: Estrutura do registro de manutencao
        run: python3 .claude/skills/backlog-review/scripts/check_backlog_structure.py BACKLOG.md
