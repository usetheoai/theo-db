name: Rust test suite

# B-013. A suíte tem 439 testes e, até 2026-08-10, NENHUM job da esteira a executava — o `ci.yml`
# constrói imagens e faz smoke, e `cargo pgrx test` não aparecia em lugar nenhum. Na primeira
# execução manual ela revelou 20 falhas, uma delas (B-011) um defeito de recall que 109 artefatos
# de benchmark não haviam pegado. Benchmark mede o caminho que se escolhe medir; teste cobre o que
# se esqueceu.
#
# A execução completa leva 480 s medidos. O argumento de custo não existe.

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   bash scripts/dev-test.sh --lint     # cargo fmt --check + clippy com o baseline
  #   bash scripts/dev-test.sh            # a suite inteira
  #   bash scripts/dev-test.sh lexical    # so o modulo tocado, em segundos
  #
  # A receita estava COPIADA AQUI E EM MAIS SETE cabecalhos, e fazia `cp -r` do codigo para dentro
  # do conteiner — o que nao preserva mtime e fazia o cargo recompilar 363 crates a cada corrida.
  # Medido: `cp -r` 363 recompilacoes / ~8 min, montagem direta **0** / 53s. Detalhe e numeros no
  # cabecalho do script (B-054).
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  #
  # Também não há gatilho de `push` em `workspace`: com um runner serial, cada commit disparava 8 min de
  # suíte à frente de publish/lint/CI. Com a remoção do `pull_request` acima, a suíte roda UMA vez por
  # promoção — no push para `develop`.
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    paths:
      - "theodb_rs/**"
      - "Dockerfile"
      - ".github/workflows/rust-suite.yml"
  push:
    branches: [main]
    paths:
      - "theodb_rs/**"
      - "Dockerfile"
      - ".github/workflows/rust-suite.yml"
  workflow_dispatch:

# O runner self-hosted e UNICO e SERIAL. Medido em 2026-08-10: este workflow, com timeout de 45 min,
# monopolizou-o e deixou `publish`, `lint-rust` e `CI` na fila por 12+ minutos — a publicacao da imagem
# so saiu depois de eu cancelar este job. Um gate de qualidade que bloqueia a entrega nao e um gate, e
# um empecilho.
#
# Duas medidas: a suíte roda uma vez por promoção (no push para `develop` — desde 2026-08-12 não roda
# mais em PR nem em cada push de workspace), e cede a vez — `group` global entre workflows não existe no
# Actions, então o que dá para fazer é não concorrer com o próprio push.
# 2026-08-20 — sem `permissions:` o job herdava o default do REPOSITORIO, que pode ser write-all.
# Medido: era o caso em quatro dos dez workflows. Este só lê a árvore.
permissions:
  contents: read

concurrency:
  group: rust-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: grátis e ilimitado, e sobretudo PARALELO —
    # a máquina paga era ÚNICA e SERIAL, e os dez workflows do mesmo push enfileiravam.
    #
    # DISCO: MEDIDO, não mais suposto. A dúvida era `theodb_rs/target` medir 13 GB contra o disco do
    # runner padrão. Corrida de 2026-08-20: a `Rust test suite` (que constrói o estágio builder e roda
    # a suíte dentro do contêiner) passou em **19 minutos**, e NENHUM job falhou por espaço. A receita
    # de remover toolchains pré-instaladas não foi necessária — e não entra sem número que a peça.
    runs-on: ubuntu-latest
    # A suíte leva 8 min; o build da imagem builder domina o resto. 45 min corta um travamento
    # sem cortar uma execução legítima — e travar é um modo de falha REAL aqui: antes do B-001, o
    # harness ficava 17 min sem saída esperando um servidor que nunca subia.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # O estágio builder do Dockerfile já tem PG18 + pgrx init + o toolchain pinado. Reusá-lo em
      # vez de montar um ambiente próprio mantém UMA definição de ambiente (a imagem que ships).
      - name: Build builder stage
        run: docker build --target theodb-rs-builder -t theodb-builder .

      # A receita de cinco peças está em wiki/runbooks/rodar-a-suite-de-testes.md. As três que o
      # ambiente precisa fornecer (as outras duas vivem no código):
      #   sudo                      → o pgrx invoca `cargo pgrx install --sudo`
      #   CARGO_PGRX_TEST_RUNAS     → postgres se recusa a rodar como root
      #   RUSTFLAGS unresolved      → o binário de teste não linka sem isto
      - name: Run suite
        run: |
          set -o pipefail
          # O `docker rm` de baixo só roda no caminho feliz. Quando o run é CANCELADO — e cada push novo
          # para o mesmo PR cancela o anterior — o passo morre antes dele e o contêiner `suite` fica órfão
          # no runner self-hosted. O run seguinte então falha com
          # `Conflict. The container name "/suite" is already in use`, ANTES de executar um único teste.
          #
          # O sintoma disso é traiçoeiro: a suíte não emite `test result`, e o gate abaixo faz
          # `line=$(grep -E "^test result" ...)` sob `bash -e` — a atribuição herda o exit 1 do grep e MATA o
          # passo sem imprimir a mensagem de erro que ele tem pronta para esse caso. O job aparece como
          # "suíte reprovou" quando o que houve foi lixo de um run cancelado.
          #
          # Medido em 2026-08-11 no PR #226, após pushes sucessivos cancelarem runs.
          #
          # B-027 (2026-08-12) — o nome passou a ser ÚNICO POR RUN, e isso ELIMINA a classe em vez de
          # remediá-la. O `docker rm -f` acrescentado ontem é remédio: depende de o passo seguinte chegar a
          # rodar, e um cancelamento no ponto errado ainda deixaria lixo com nome fixo. Com
          # `suite-${{ github.run_id }}-${{ github.run_attempt }}` não existe colisão possível — dois runs
          # nunca disputam o mesmo nome, mesmo que o anterior tenha morrido no meio.
          #
          # O `rm -f` fica, agora como higiene local do próprio run (re-tentativa do mesmo attempt), e o
          # `docker container prune` varre o que runs cancelados antigos deixaram para trás — sem ele, os
          # órfãos já criados no runner continuariam ocupando disco para sempre.
          CONTAINER="suite-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker container prune -f --filter "until=24h" >/dev/null 2>&1 || true
          docker run --name "$CONTAINER" theodb-builder bash -c '
            apt-get update -qq && apt-get install -y -qq sudo
            useradd -m postgres 2>/dev/null || true
            mkdir -p /pgdata && chown postgres /pgdata
            chmod -R a+rwX /tmp/theodb_rs
            cd /tmp/theodb_rs
            export CARGO_PGRX_TEST_RUNAS=postgres
            export CARGO_PGRX_TEST_PGDATA=/pgdata
            export RUSTFLAGS="-Clink-arg=-Wl,--unresolved-symbols=ignore-all"
            cargo pgrx test pg18
          ' 2>&1 | tee suite.log || true
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

      # O gate NÃO é "zero falhas" — seria reprovar todo push a partir de hoje, e um CI que
      # reprova sempre é um CI que alguém desliga. É "não pode PIORAR": o baseline é o número
      # medido em 2026-08-10 (era 20; caiu para 10 ao fechar B-011 e as 8 de registro de schema) e cada falha nova reprova.
      #
      # 2026-08-11 — baixado de 10 para 6 ao fechar o B-015: `434 passed; 6 failed` medido na suíte completa
      # (`cargo pgrx test pg18`, 539,43 s). Fecharam os cinco testes de contador em zero — três colunares
      # (`chunk_skip_prunes_and_ab_identical`, `enable_chunk_skip_guc_off_disables_skip`,
      # `predicate_pushdown_best_effort`) e dois de autotune (`scan_stats_records_real_pages_read`,
      # `explain_scan_shows_index_and_candidates`) — mais o teste novo que amarra a causa.
      #
      # RESSALVA DE MÉTODO: os 10 do baseline anterior foram medidos em outro commit e em outra data; eu não
      # rodei a suíte completa ANTES desta mudança, só o subconjunto filtrado (que falhava 2/2). Então "10 → 6"
      # é a comparação de dois números honestos medidos em momentos diferentes, NÃO um A/B pareado no mesmo
      # commit. O que está pareado é o subconjunto: RED 2/2 antes, GREEN 6/6 depois.
      #
      # RESSALVA REGISTRADA (log de intake de B-013): este baseline só é honesto enquanto o B-012
      # estiver ativo para derrubá-lo. Se o B-012 morrer, o número vira permanente sem ninguém ter
      # decidido isso, e o gate passa a proteger a dívida em vez do produto. Ao fechar cada falha,
      # BAIXE o baseline no mesmo commit.
      #
      # 2026-08-12 — BASELINE = 0. A dívida acabou: `440 passed; 0 failed` medido na suíte completa
      # (353,01 s). As seis últimas caíram assim:
      #   · 2 (B-022) declaravam FRAGMENTO em `#[pg_test(error=)]` e o pgrx compara a mensagem INTEIRA;
      #   · 3 (B-016) apontavam para loopback, que a guarda de egress recusa ANTES de conectar — dois
      #     passaram a usar `invalid.invalid` (RFC 2606) e o do disjuntor virou hermético;
      #   · 1 (B-023) era um microbenchmark que media a TÉRMICA do laptop: AVX sempre medido primeiro,
      #     amostra única, num i7-1355U de 15 W. Passou a alternar rodadas e comparar medianas.
      # Nos seis, o produto estava CERTO e o teste é que estava desatualizado ou mal-instrumentado.
      #
      # O gate deixa de proteger dívida e passa a proteger o produto: a partir daqui, QUALQUER falha
      # reprova. É o estado que a ressalva acima pedia desde o começo.
      - name: Gate — falhas não podem aumentar
        env:
          BASELINE: "0"
        run: |
          line=$(grep -E "^test result" suite.log | tail -1)
          echo "$line"
          [ -n "$line" ] || { echo "::error::a suíte não emitiu resultado — travou ou não compilou"; exit 1; }
          failed=$(echo "$line" | sed -E 's/.* ([0-9]+) failed.*/\1/')
          passed=$(echo "$line" | sed -E 's/.*result: [A-Za-z]+\. ([0-9]+) passed.*/\1/')
          echo "passed=$passed failed=$failed baseline=$BASELINE"
          echo "### Suíte Rust" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$passed\` passam · \`$failed\` falham · baseline \`$BASELINE\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt "$BASELINE" ]; then
            echo "::error::regressão — $failed falhas contra baseline de $BASELINE"
            grep -E "^    [a-z_]+::" suite.log | tail -40
            exit 1
          fi
          if [ "$failed" -lt "$BASELINE" ]; then
            echo "::notice::$((BASELINE - failed)) falha(s) a menos que o baseline — baixe BASELINE para $failed neste mesmo commit"
          fi
