# Gate de sintaxe/semântica dos próprios workflows (#211).
#
# O DEFEITO QUE ISTO PREVINE, medido em 2026-07-27: `license-gate` (a regra D1/AGPL), `lint-rust`,
# `cassert-sql-safety` e `schema-drift-gate` passaram TRÊS DIAS sem executar um único step. Cada um
# declarava `paths` e `paths-ignore` no mesmo evento — combinação que o GitHub rejeita no parse —,
# então os runs morriam em `startup_failure` com zero jobs. Na lista de runs isso aparece apenas
# como `failure`, indistinguível de um teste quebrado: 95 de 100 runs, e ninguém procurou a causa.
#
# Nenhum gate do repo olhava para os workflows em si. Este olha.
#
# Verificado, não presumido — o repro exato do bug contra esta mesma imagem:
#
#   .github/workflows/bug.yml:7:5: both "paths" and "paths-ignore" filters cannot be used for the
#   same event "push". note: use '!' to negate patterns [events]
#
# O linter inclusive sugere a correção que foi aplicada (padrão negado dentro do `paths:`).
#
# Regra 9 (não reinvente): actionlint é o linter de-facto de GitHub Actions, e traz shellcheck
# embutido para os blocos `run:` — que é como o resto dos achados aqui aparece.
name: actionlint

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   bash scripts/dev-test.sh --lint     # cargo fmt --check + clippy com o baseline
  #   bash scripts/dev-test.sh            # a suite inteira
  #   bash scripts/dev-test.sh lexical    # so o modulo tocado, em segundos
  #
  # A receita estava COPIADA AQUI E EM MAIS SETE cabecalhos, e fazia `cp -r` do codigo para dentro
  # do conteiner — o que nao preserva mtime e fazia o cargo recompilar 363 crates a cada corrida.
  # Medido: `cp -r` 363 recompilacoes / ~8 min, montagem direta **0** / 53s. Detalhe e numeros no
  # cabecalho do script (B-054).
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  actionlint:
    # 2026-08-20 — runner GITHUB-HOSTED, não o self-hosted da frota. Medido antes de trocar:
    # este repositório é PÚBLICO, e runner padrão do GitHub é grátis e ilimitado em repo público —
    # enquanto o `theodb-do` é uma máquina paga. Pior: ela é ÚNICA e SERIAL, então os dez workflows
    # disparados pelo mesmo push enfileiram. Medição do custo real disso: `lint-rust` levou de 66 a
    # 120 minutos para rodar um `cargo fmt --check`, quase tudo fila.
    #
    # Este job cabe aqui porque NÃO precisa da máquina grande: nada de Rust, nada de pgrx, nada de
    # `pg_config`. Os jobs que compilam continuam em `vars.CI_RUNNER` — a troca é por job e por
    # necessidade medida, não por decreto.
    runs-on: ubuntu-latest
    # Medido: o scan dos 10 workflows leva segundos. 10 min é folga para o pull da imagem num
    # runner frio, não uma estimativa do trabalho.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (workflows + shellcheck dos blocos run:)
        # Imagem fixada por digest, consistente com a política de supply-chain do repo (mesmo
        # padrão do pgvector em `migration-smoke`). `-color` força cor mesmo sem TTY.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Toda invocação de workflow aponta para um arquivo que existe?
        # B-029 — o `actionlint` acima valida a SINTAXE do workflow e a forma das expressões; ele não
        # abre o arquivo que um `run:` manda o bash executar. São perguntas diferentes, e só uma
        # estava sendo feita: em 2026-08-13 havia 10 invocações de 6 scripts ausentes, e o actionlint
        # passou verde sobre elas no dia anterior.
        #
        # A quebra tinha ficado ARMADA por um dia e meio — os gates só rodam em push para
        # develop/main, e o commit da remoção ainda não chegara lá. Quando chegasse, o job falharia
        # por arquivo ausente, indistinguível de regressão real: a mesma classe que o B-027 acabou
        # de eliminar do outro lado.
        #
        # Este passo custa milissegundos e mora aqui, e não num workflow próprio, porque o
        # `actionlint` já é o job barato que olha para `.github/workflows/`.
        run: bash scripts/check-workflow-paths.sh
