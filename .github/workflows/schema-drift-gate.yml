# M137 / F5 — o gate que impede a versão de voltar a mentir.
#
# O DEFEITO QUE ISTO PREVINE, medido em 2026-07-21: o `theodb_rs` passou 120 releases com
# `default_version = '1.0.0'` enquanto a superfície SQL ia de 18 → 48 → 60 → 78 funções `pg_extern`. Resultado:
# `1.0.0` rotulava pelo menos CINCO catálogos diferentes, e não existia delta correto a partir dele — foi isso
# que obrigou o primeiro salto da cadeia a ser convergente em vez de incremental.
#
# O M137 consertou o passado. Este gate impede o futuro, porque a mecânica que produziu o defeito continua ativa:
# o pgrx **regenera** o script de instalação a partir do `default_version` a cada build, enquanto os scripts de
# upgrade são snapshots congelados. Adicionar um `#[pg_extern]` sem bumpar a versão faz a instalação limpa ter a
# função nova e a instalação atualizada não — as duas reportando a MESMA `extversion`. Exatamente o bug de novo,
# uma versão adiante.
#
# Por que um gate barato em vez do SchemaBot completo do ParadeDB (que gera dois schemas com `cargo pgrx schema` e
# os compara com um differ semântico): aquilo custa dois builds completos do pgrx por PR. Este aqui é uma
# heurística estrutural — não prova que o delta está CORRETO, só que alguém foi obrigado a pensar nele. É o degrau
# da parsimony ladder que resolve a necessidade presente; o differ semântico entra quando houver evidência de que
# esta checagem deixou passar algo.
name: schema-drift-gate

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   docker run --rm -v $PWD/theodb_rs:/src theodb-builder:latest bash -c '
  #     rustup component add clippy rustfmt --toolchain 1.97.0-x86_64-unknown-linux-gnu
  #     mkdir -p /tmp/b && cp -r /src/. /tmp/b/ && cd /tmp/b
  #     cargo fmt -- --check && cargo clippy --features pg18 --no-deps -- $(grep -v "^#" .clippy_args | tr "\n" " ")
  #     cargo pgrx test pg18'
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  workflow_dispatch:
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    # #211 — NÃO adicione `paths-ignore:` aqui. O GitHub proíbe `paths` e `paths-ignore` no MESMO
    # evento e rejeita o arquivo no parse (`startup_failure`, zero jobs): este gate marcou 100 de
    # 100 runs falhos até 27/07. A economia de fila que #187 buscava se expressa DENTRO do `paths:`,
    # via padrão negado — um filtro só, sem conflito. `.claude/**` e `wiki/**` já estão fora por
    # construção; o `!**/*.md` é guarda de futuro (hoje não há `.md` sob `theodb_rs/src|sql/`).
    paths:
      - 'theodb_rs/src/**'
      - 'theodb_rs/theodb_rs.control'
      - 'theodb_rs/sql/**'
      - '!**/*.md'

  push:
    branches: [main]
    # #211 — NÃO adicione `paths-ignore:` aqui. O GitHub proíbe `paths` e `paths-ignore` no MESMO
    # evento e rejeita o arquivo no parse (`startup_failure`, zero jobs): este gate marcou 100 de
    # 100 runs falhos até 27/07. A economia de fila que #187 buscava se expressa DENTRO do `paths:`,
    # via padrão negado — um filtro só, sem conflito. `.claude/**` e `wiki/**` já estão fora por
    # construção; o `!**/*.md` é guarda de futuro (hoje não há `.md` sob `theodb_rs/src|sql/`).
    paths:
      - 'theodb_rs/src/**'
      - 'theodb_rs/theodb_rs.control'
      - 'theodb_rs/sql/**'
      - '!**/*.md'

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
# Sem `permissions:` o job herdava o default do repositório, que pode ser write-all.
# Este gate só lê a árvore (2026-08-20).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  drift:
    # 2026-08-20 — runner GITHUB-HOSTED, não o self-hosted da frota. Medido antes de trocar:
    # este repositório é PÚBLICO, e runner padrão do GitHub é grátis e ilimitado em repo público —
    # enquanto o `theodb-do` é uma máquina paga. Pior: ela é ÚNICA e SERIAL, então os dez workflows
    # disparados pelo mesmo push enfileiram. Medição do custo real disso: `lint-rust` levou de 66 a
    # 120 minutos para rodar um `cargo fmt --check`, quase tudo fila.
    #
    # Este job cabe aqui porque NÃO precisa da máquina grande: nada de Rust, nada de pgrx, nada de
    # `pg_config`. Os jobs que compilam continuam em `vars.CI_RUNNER` — a troca é por job e por
    # necessidade medida, não por decreto.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: A superfície mudou sem que a cadeia de upgrade acompanhasse?
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Primeiro push de um branch novo tem `before` zerado — nada com que comparar, então não há drift a
          # detectar. Sair verde é correto aqui; falhar seria ruído.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "sem base de comparação (branch novo) — nada a checar"; exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)
          CTL=$(echo "$CHANGED" | grep -c '^theodb_rs/theodb_rs.control$' || true)
          MIG=$(echo "$CHANGED" | grep -cE '^theodb_rs/sql/theodb_rs--.*--.*\.sql$' || true)

          # #217 — SUPERFICIE, nao proxy de caminho. A versao anterior cobrava bump sempre que QUALQUER
          # arquivo sob `theodb_rs/src/` mudasse. Num PR de release o `base.sha` e `main`, entao o diff
          # e o MILESTONE INTEIRO: todo milestone que tocasse planner/executor disparava o gate sem ter
          # alterado uma unica funcao SQL. Nao havia caminho para o verde, e ele reprovou em 100% dos
          # PRs de release recentes — um gate que sempre falha ensina o time a mergear por cima do CI.
          bash scripts/sql-surface.sh "$BASE" > /tmp/surface-base.txt
          bash scripts/sql-surface.sh HEAD    > /tmp/surface-head.txt
          if diff -q /tmp/surface-base.txt /tmp/surface-head.txt >/dev/null; then
            SURFACE_CHANGED=0
          else
            SURFACE_CHANGED=1
          fi

          echo "superfície mudou=$SURFACE_CHANGED  control=$CTL  migração=$MIG"

          if [ "$SURFACE_CHANGED" -eq 1 ] && [ "$CTL" -eq 0 ] && [ "$MIG" -eq 0 ]; then
            echo "::error::A superfície SQL da extensão mudou sem bumpar default_version nem adicionar"
            echo "::error::script de upgrade. É assim que '1.0.0' passou a rotular cinco catálogos"
            echo "::error::diferentes ao longo de 120 releases (ver wiki/benchmarks/m137-upgrade-chain.md)."
            echo "::error::Objetos que entraram ou saíram do catálogo:"
            diff /tmp/surface-base.txt /tmp/surface-head.txt | grep -E '^[<>]' | head -40 | while read -r l; do
              echo "::error::  $l"
            done
            echo "::error::Um refactor interno, comentário ou teste NÃO chega aqui — a superfície é medida,"
            echo "::error::não inferida do caminho do arquivo. Se estes objetos são mesmo novos, bumpe o"
            echo "::error::.control e adicione o script de upgrade correspondente."
            exit 1
          fi
          echo "ok — ou a superfície não mudou, ou a cadeia de upgrade acompanhou"

      - name: Migração já lançada não pode ser editada
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          # Editar um script de upgrade cujo alvo já foi lançado é irrecuperável: quem já atualizou nunca roda a
          # correção, e passa a divergir de quem instalar depois. É o bug que o ParadeDB documentou no próprio
          # 0.24.1--0.24.2. Aqui a tag do produto (vX.Y.Z) é o marcador de "já lançado".
          fail=0
          for f in $(git diff --name-only "$BASE" HEAD | grep -E '^theodb_rs/sql/theodb_rs--.*--.*\.sql$' || true); do
            target=$(basename "$f" .sql | sed 's/.*--//')
            if git rev-parse -q --verify "refs/tags/v${target}" >/dev/null 2>&1; then
              echo "::error file=$f::Script de upgrade com alvo $target editado, mas a tag v$target já existe."
              echo "::error file=$f::Quem já atualizou nunca receberá esta mudança. Mova-a para o próximo salto."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "ok — nenhuma migração já lançada foi editada"
          exit $fail
