# M136 — gates mecânicos de Rust: fmt, clippy (-D warnings via baseline), deps não usadas, lockfile, doc.
#
# O DEFEITO QUE ISTO PREVINE (medido 2026-07-21): 1056 warnings clippy e o código NUNCA rustfmt-formatado —
# zero gate mecânico de Rust contra 28 regras + 40 skills de PROCESSO. O mutirão fmt (c6025d3) tornou o código
# fmt-clean; este workflow impede a regressão e barra warnings NOVOS.
#
# Roda no runner self-hosted (theodb-do), que já tem cargo + `cargo pgrx init --pg18` (o clippy sobre código
# pgrx precisa de um pg_config). Precedente: paradedb `lint-rust.yml` (fmt --check, clippy -D warnings --no-deps,
# machete, taplo) e neon (`.neon_clippy_args` — args num arquivo único, consumido por CI E local, sem drift).
name: lint-rust

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   docker run --rm -v $PWD/theodb_rs:/src theodb-builder:latest bash -c '
  #     rustup component add clippy rustfmt --toolchain 1.97.0-x86_64-unknown-linux-gnu
  #     mkdir -p /tmp/b && cp -r /src/. /tmp/b/ && cd /tmp/b
  #     cargo fmt -- --check && cargo clippy --features pg18 --no-deps -- $(grep -v "^#" .clippy_args | tr "\n" " ")
  #     cargo pgrx test pg18'
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  workflow_dispatch:
  push:
    branches: [develop, main]
    # #211 — NÃO adicione `paths-ignore:` aqui. O GitHub proíbe `paths` e `paths-ignore` no MESMO
    # evento e rejeita o arquivo no parse (`startup_failure`, zero jobs): foi o que matou este gate
    # em 95 de 100 runs entre 24 e 27/07. A economia de fila que #187 buscava se expressa DENTRO do
    # `paths:`, via padrão negado — um filtro só, sem conflito.
    #
    # `.claude/**` e `wiki/**` já estão fora por construção (não casam nenhum padrão positivo).
    # O `!**/*.md` é guarda de FUTURO, não economia de hoje: em 2026-07-27 não existe nenhum `.md`
    # sob `theodb_rs/`, mas `theodb_rs/**` engoliria um `theodb_rs/README.md` no dia em que alguém
    # criar um — e recompilar pgrx por causa de um README é exatamente o desperdício que #187 atacava.
    paths:
      - 'theodb_rs/**'
      - '.github/workflows/lint-rust.yml'
      - '!**/*.md'

permissions:
  contents: read

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  lint:
    # 2026-08-20 — runner GitHub-hosted. Repo PÚBLICO: runner padrão é grátis e ilimitado, enquanto
    # o `theodb-do` é pago, único e SERIAL. Medido: este workflow levou de 66 a 120 minutos para um
    # `cargo fmt --check`, quase tudo fila atrás dos outros nove.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: theodb_rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 2026-08-20 — runner efêmero não tem o toolchain quente que a máquina paga tinha.
      # O Dockerfile já ensina o caminho barato: `cargo pgrx init --pg18 "$(which pg_config)"`
      # usa o pg_config do SISTEMA em vez de compilar PostgreSQL. Reproduzido aqui.
      - name: PostgreSQL 18 do PGDG (o `pg_config` que o pgrx vai usar)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-18 postgresql-server-dev-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # `~/.cargo/bin` e `~/.pgrx` cacheados juntos: sem isso, cada corrida reinstala o
      # `cargo-pgrx` (compilação longa) para rodar um `cargo fmt` de segundos.
      - name: Cache do cargo-pgrx e do pgrx init
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.pgrx
          key: pgrx-${{ runner.os }}-0.19.0-pg18-${{ hashFiles('theodb_rs/Cargo.lock') }}
          restore-keys: pgrx-${{ runner.os }}-0.19.0-pg18-

      - name: cargo-pgrx + init (no-op quando o cache acertou)
        run: |
          set -euo pipefail
          command -v cargo-pgrx >/dev/null || cargo install --locked cargo-pgrx --version 0.19.0
          [ -d "$HOME/.pgrx" ] || cargo pgrx init --pg18 "$(which pg_config)"

      # Verifica AQUI, e não no primeiro passo que precisa deles. A toolchain declara `components`
      # em `rust-toolchain.toml` desde 2026-08-20, mas quem depende disso deve provar que chegou:
      # a corrida anterior morreu em `error: 'cargo-fmt' is not installed`, e morreu três passos
      # depois do ponto onde a causa estava.
      - name: Os componentes da toolchain chegaram?
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --version
          cargo clippy --version

      - name: Lockfile drift (cargo metadata --locked)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Rustfmt (cargo fmt --check)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt -- --check

      # #171 — `cargo fmt` percorre a ARVORE DE MODULOS, e um arquivo trazido por `include!` nao e
      # modulo: ele e texto colado antes da expansao de macro. `src/vec/ah_tests.rs` (363 linhas)
      # nunca foi visto pelo gate, e drift acumulou ali sem ninguem notar — o mesmo mecanismo que
      # deixou 58 hunks se juntarem no resto do crate (#217).
      #
      # A lista e DESCOBERTA do codigo, nao mantida a mao: um `include!` novo entra no gate sozinho.
      # Manter uma lista fixa aqui seria repetir o erro de origem — algo fora do alcance do check.
      #
      # CUSTO DECLARADO: o rustfmt formata o arquivo como se fosse topo de arquivo, entao os itens
      # perdem a indentacao de 4 espacos que tinham por viver dentro de `mod tests { … }` no ponto do
      # splice. O compilador e indiferente (include! e colagem textual); a leitura no contexto muda.
      # Foi uma escolha: um arquivo VERIFICADO com indentacao plana vale mais que um arquivo bonito
      # que ninguem checa — e o #217 mostrou onde termina a segunda opcao.
      - name: Rustfmt nos arquivos trazidos por `include!` (#171)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mapfile -t INCLUDED < <(
            grep -rhoE 'include!\("[^"]+"\)' src --include='*.rs' \
              | sed -E 's/include!\("([^"]+)"\)/\1/' | sort -u
          )
          if [ "${#INCLUDED[@]}" -eq 0 ]; then
            echo "nenhum include! no crate — nada a checar"; exit 0
          fi
          rc=0
          for name in "${INCLUDED[@]}"; do
            # `include!` resolve relativo ao arquivo que inclui; procuramos pelo nome sob src/.
            while IFS= read -r f; do
              echo "rustfmt --check $f"
              rustfmt --edition 2024 --config-path rustfmt.toml --check "$f" || rc=1
            done < <(find src -name "$(basename "$name")" -type f)
          done
          exit "$rc"

      - name: Clippy (-D warnings via .clippy_args baseline)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # O arquivo único de args (padrão neon) — CI e local leem o MESMO baseline, sem drift.
          # Array em vez de string: `-- $ARGS` sem aspas depende de word-splitting (SC2086), que
          # engasga em qualquer arg com espaço. `read -a` divide UMA vez, de forma explícita, e o
          # `"${ARGS[@]}"` passa cada flag como um argumento — o mesmo efeito pretendido, sem a
          # armadilha.
          #
          # O `printf '\n'` no fim NAO e cosmetico. `read` devolve 1 quando a entrada termina SEM
          # newline, e o `tr '\n' ' '` garante exatamente isso — entao, sob o `bash -e` deste step, a
          # linha MATAVA O JOB antes de `cargo clippy` rodar uma unica vez. Provado:
          #
          #   bash -e -c 'read -r -a A < <(printf "x y z"); echo nunca-chega'   -> exit 1
          #   bash    -c 'read -r -a A < <(printf "x y z"); echo $?'            -> 1, A preenchido
          #
          # Ficou invisivel porque o step `Rustfmt`, ANTES deste, falhava sempre (#217 gate 2) e
          # parava o job. Consertar o fmt expos um gate de clippy que nunca guardou nada: 30ms entre
          # o echo do comando e o erro, sem uma linha de saida do clippy.
          read -r -a ARGS < <(grep -v '^#' .clippy_args | grep -v '^[[:space:]]*$' | tr '\n' ' '; printf '\n')
          echo "clippy args: ${ARGS[*]}"
          cargo clippy --features pg18 --no-deps -- "${ARGS[@]}"

      # M140.2 — o núcleo lexical vive num crate pgrx-free (`theodb_lexical`), testável com `cargo test` stock.
      # O clippy default (--features pg18) NÃO compila o path `spike-lexical` (o cdylib consumindo o núcleo).
      # Estes dois passos fecham essa lacuna: (1) o núcleo isolado testa sem pgrx; (2) o cdylib compila
      # consumindo o núcleo. Sem isto, uma regressão no consumo do núcleo só apareceria no M140.3.
      - name: Lexical core — stock cargo test (pgrx-free)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test -p theodb_lexical
          # gate objetivo do "pgrx-free": zero pgrx no tree do núcleo
          test "$(cargo tree -p theodb_lexical | grep -c pgrx)" = "0"

      - name: Lexical spike — cdylib consumes the core (check --features spike-lexical)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo check --features "pg18 spike-lexical"

      - name: Unused dependencies (cargo machete)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-machete >/dev/null || cargo install --locked cargo-machete
          cargo machete

      - name: Doc rot (cargo doc)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # `-D warnings` no rustdoc entra no burn-down junto com os warnings do clippy (mesmo backlog de 1056):
          # ligá-lo hoje travaria o build com doc-warnings pré-existentes. Sem -D, ainda pega ERROS de doc
          # (links quebrados, código de exemplo que não compila). Promover a -D warnings quando o burn-down zerar.
          cargo doc --no-deps --features pg18 --document-private-items
