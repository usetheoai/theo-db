# M136 — gates mecânicos de Rust: fmt, clippy (-D warnings via baseline), deps não usadas, lockfile, doc.
#
# O DEFEITO QUE ISTO PREVINE (medido 2026-07-21): 1056 warnings clippy e o código NUNCA rustfmt-formatado —
# zero gate mecânico de Rust contra 28 regras + 40 skills de PROCESSO. O mutirão fmt (c6025d3) tornou o código
# fmt-clean; este workflow impede a regressão e barra warnings NOVOS.
#
# Roda no runner self-hosted (theodb-do), que já tem cargo + `cargo pgrx init --pg18` (o clippy sobre código
# pgrx precisa de um pg_config). Precedente: paradedb `lint-rust.yml` (fmt --check, clippy -D warnings --no-deps,
# machete, taplo) e neon (`.neon_clippy_args` — args num arquivo único, consumido por CI E local, sem drift).
name: lint-rust

on:
  push:
    branches: [develop, main]
    paths: ['theodb_rs/**', '.github/workflows/lint-rust.yml']
  pull_request:
    branches: [develop, main]
    paths: ['theodb_rs/**', '.github/workflows/lint-rust.yml']

permissions:
  contents: read

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. Em `main` NUNCA cancela (um run de release em andamento não pode ser abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: [self-hosted, theodb-do]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: theodb_rs
    steps:
      - uses: actions/checkout@v4

      - name: Lockfile drift (cargo metadata --locked)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Rustfmt (cargo fmt --check)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt -- --check

      - name: Clippy (-D warnings via .clippy_args baseline)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # O arquivo único de args (padrão neon) — CI e local leem o MESMO baseline, sem drift.
          ARGS=$(grep -v '^#' .clippy_args | grep -v '^[[:space:]]*$' | tr '\n' ' ')
          echo "clippy args: $ARGS"
          cargo clippy --features pg18 --no-deps -- $ARGS

      # M140.2 — o núcleo lexical vive num crate pgrx-free (`theodb_lexical`), testável com `cargo test` stock.
      # O clippy default (--features pg18) NÃO compila o path `spike-lexical` (o cdylib consumindo o núcleo).
      # Estes dois passos fecham essa lacuna: (1) o núcleo isolado testa sem pgrx; (2) o cdylib compila
      # consumindo o núcleo. Sem isto, uma regressão no consumo do núcleo só apareceria no M140.3.
      - name: Lexical core — stock cargo test (pgrx-free)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test -p theodb_lexical
          # gate objetivo do "pgrx-free": zero pgrx no tree do núcleo
          test "$(cargo tree -p theodb_lexical | grep -c pgrx)" = "0"

      - name: Lexical spike — cdylib consumes the core (check --features spike-lexical)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo check --features "pg18 spike-lexical"

      - name: Unused dependencies (cargo machete)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-machete >/dev/null || cargo install --locked cargo-machete
          cargo machete

      - name: Doc rot (cargo doc)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # `-D warnings` no rustdoc entra no burn-down junto com os warnings do clippy (mesmo backlog de 1056):
          # ligá-lo hoje travaria o build com doc-warnings pré-existentes. Sem -D, ainda pega ERROS de doc
          # (links quebrados, código de exemplo que não compila). Promover a -D warnings quando o burn-down zerar.
          cargo doc --no-deps --features pg18 --document-private-items
