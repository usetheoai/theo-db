# M133 (#140) — CI canary.
#
# Purpose: distinguish "the repository's workflows are broken" from "Actions cannot run at all for this account".
# This job has NO dependencies, NO secrets, NO services and a single trivial step. If even THIS reports 0 executed
# steps, the failure is upstream of the repository (runner never provisioned — e.g. exhausted Actions minutes or a
# spending limit on a private repo) and no repository change can fix it.
#
# It doubles as a permanent liveness signal: a green canary means CI is capable of running; a canary that dies
# pre-step means the whole suite's red is infrastructural, not a code regression.
name: ci-canary

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  canary:
    runs-on: [self-hosted, theodb-do]
    timeout-minutes: 5
    steps:
      - name: Prove a runner executed a step
        run: |
          echo "canary: runner provisioned and executing steps"
          echo "runner_os=${RUNNER_OS} arch=$(uname -m)"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
