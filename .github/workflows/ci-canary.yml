# M133 (#140) — CI canary.
#
# Purpose: distinguish "the repository's workflows are broken" from "Actions cannot run at all for this account".
# This job has NO dependencies, NO secrets, NO services and a single trivial step. If even THIS reports 0 executed
# steps, the failure is upstream of the repository (runner never provisioned — e.g. exhausted Actions minutes or a
# spending limit on a private repo) and no repository change can fix it.
#
# It doubles as a permanent liveness signal: a green canary means CI is capable of running; a canary that dies
# pre-step means the whole suite's red is infrastructural, not a code regression.
name: ci-canary

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   docker run --rm -v $PWD/theodb_rs:/src theodb-builder:latest bash -c '
  #     rustup component add clippy rustfmt --toolchain 1.97.0-x86_64-unknown-linux-gnu
  #     mkdir -p /tmp/b && cp -r /src/. /tmp/b/ && cd /tmp/b
  #     cargo fmt -- --check && cargo clippy --features pg18 --no-deps -- $(grep -v "^#" .clippy_args | tr "\n" " ")
  #     cargo pgrx test pg18'
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    # #187 — o runner é ÚNICO e serial: cada push dispara ~14 jobs de ~45min (≈10h de fila).
    # Mudanças só de documentação/artefatos de agente não exercitam código e não podem consumir
    # essa capacidade. Mesmo padrão do theo-memory/theo-rag.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'wiki/**'
  push:
    branches: [main]
    # #187 — o runner é ÚNICO e serial: cada push dispara ~14 jobs de ~45min (≈10h de fila).
    # Mudanças só de documentação/artefatos de agente não exercitam código e não podem consumir
    # essa capacidade. Mesmo padrão do theo-memory/theo-rag.
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'wiki/**'
  workflow_dispatch:

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
# 2026-08-20 — sem `permissions:` o job herdava o default do REPOSITORIO, que pode ser write-all.
# Medido: era o caso em quatro dos dez workflows. Este só lê a árvore.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  canary:
    # 2026-08-20 — segue a frota para `ubuntu-latest`. Um canário que roda numa classe de runner
    # DIFERENTE da frota não prova nada sobre ela: ele existe para separar "os workflows estão
    # quebrados" de "o Actions não roda para esta conta", e isso só vale no mesmo ambiente.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove a runner executed a step
        run: |
          echo "canary: runner provisioned and executing steps"
          echo "runner_os=${RUNNER_OS} arch=$(uname -m)"
          date -u +"%Y-%m-%dT%H:%M:%SZ"
