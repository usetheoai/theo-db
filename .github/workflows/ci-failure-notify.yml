# M133 / #140 — a rede que faz um CI morto ou vermelho aparecer NA HORA, não depois de 30 runs silenciosos.
#
# O DEFEITO QUE ISTO PREVINE (medido no #140): todo job do Actions morria pré-step em ~2s com `"steps": []`
# e `BlobNotFound` (sem log), e isso passou **30+ runs consecutivos** sem ninguém notar — as releases
# v0.113.0–v0.117.0 foram todas mergeadas vermelhas. A causa-raiz (bloqueio de billing só atinge runners
# HOSPEDADOS; o self-hosted despacha mesmo assim) foi resolvida com o runner `theodb-do-1`. Mas nada avisava
# que o sinal tinha morrido — a ausência de sinal é invisível por construção. Este workflow fecha esse buraco.
#
# COMO: dispara em `workflow_run` (após o CI principal concluir) e, se a conclusão for `failure` em develop/main,
# abre OU atualiza um issue de rastreamento (dedup por título) com o link do run e o SHA. Um CI vermelho vira um
# issue imediatamente; um CI que volte a morrer pré-step também (a conclusão `failure` cobre os dois). Roda no
# runner hospedado do GitHub para NÃO depender do mesmo self-hosted que pode estar exatamente indisponível —
# mas como o billing bloqueia hospedados, cai no self-hosted por labels; a robustez real vem de `if: always()`
# no consumo e de o job ser barato (só chamadas de API). Se o próprio notifier morrer, o silêncio é o mesmo de
# antes — não pior; e o schedule diário abaixo é a rede de segunda ordem que não depende de nenhum push.
name: ci-failure-notify

on:
  workflow_run:
    workflows: ["CI", "ci-canary", "license-gate", "schema-drift-gate"]
    types: [completed]

permissions:
  issues: write
  actions: read

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  notify-on-failure:
    # Só age quando o run observado FALHOU num branch protegido. Sucesso é o caso comum e não gera ruído.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')
    # 2026-08-20 — o default deixou de ser a máquina paga. `vars.CI_RUNNER` continua sendo o
    # lugar único que governa a frota; o que mudou é para onde ela aponta quando ninguém diz nada.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Duas chamadas de API via `gh`. 10 min é folga larga; sem isto o default é 360 min, e um
    # `gh` pendurado numa rede ruim seguraria o runner serial de 5 repos por 6 horas — para
    # abrir um issue.
    timeout-minutes: 10
    steps:
      - name: Abrir ou atualizar o issue de CI vermelho
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="CI vermelho em ${BRANCH}: workflow \"${WF}\" falhou"
          BODY="O workflow **${WF}** concluiu com **failure** em \`${BRANCH}\` (SHA \`${SHA}\`).

          Run: ${RUN_URL}

          Este issue é aberto automaticamente por \`ci-failure-notify\` (M133/#140) para que um CI vermelho — ou
          um CI que volte a morrer pré-step — apareça na hora, e não fique 30 runs invisível. Feche quando o
          sinal voltar a verde; o notifier reabre/comenta se falhar de novo."
          # Dedup: se já existe um issue ABERTO com este título, comenta nele; senão, cria.
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "in:title \"${TITLE}\"" \
                       --json number,title --jq ".[] | select(.title==\"${TITLE}\") | .number" | head -1)
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Falhou de novo — SHA \`${SHA}\`, run ${RUN_URL}"
            echo "comentado no issue #${EXISTING}"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label ci
            echo "issue criado para ${WF} em ${BRANCH}"
          fi
