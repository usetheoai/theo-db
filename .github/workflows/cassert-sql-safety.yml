# M136 — os DOIS gates de maior valor/custo num só build: Postgres cassert (item 4) + pgspot na SQL (item 5).
#
# Um `cargo pgrx install` serve os dois (o runner serializa; compilar duas vezes seria desperdício):
#   - cassert: exercita os 4 index/table AMs + columnar sob um PG `--enable-cassert` (a classe do crash #143;
#     em release Assert() é no-op, então esta é a ÚNICA cobertura de asserção do engine — lição #1 do paradedb).
#   - pgspot: varre a SQL de instalação gerada pelo pgrx (94 pg_extern) por DDL inseguro (SECURITY DEFINER com
#     search_path mutável, etc.). Baseline dos 6 códigos atuais (PS001/002/005/010/016/017 — handlers de AM em
#     C, CREATE SCHEMA, e search_path das funções SQL SECURITY INVOKER); burn-down rastreado em issue própria.
#
# Verificado direto no droplet (2026-07-21): cassert-smoke exit 0 (0 asserts/crashes); pgspot com baseline 0/0.
# initdb recusa rodar como root, então o smoke roda via `runuser -u pgtest` (padrão M137). Roda no runner
# self-hosted, cujo PG18 do pgrx foi compilado com --enable-cassert (pg_config --configure confirma).
name: cassert-sql-safety

on:
  # 2026-08-12 — gatilho de `pull_request` REMOVIDO por decisão do owner: o runner é único e serial, e
  # cada PR disparava a esteira inteira a cada push, com custo elevado. A esteira passa a rodar SÓ no
  # `push` para `develop`/`main` — ou seja, DEPOIS do merge.
  #
  # A TROCA É REAL e fica dita: sem gate no PR, um defeito só aparece quando já está em `develop`, e
  # quem descobre é o próximo a integrar. A proteção não some, muda de lugar — passa a depender de
  # rodar os gates LOCALMENTE antes de promover, no contêiner com o toolchain pinado:
  #   bash scripts/dev-test.sh --lint     # cargo fmt --check + clippy com o baseline
  #   bash scripts/dev-test.sh            # a suite inteira
  #   bash scripts/dev-test.sh lexical    # so o modulo tocado, em segundos
  #
  # A receita estava COPIADA AQUI E EM MAIS SETE cabecalhos, e fazia `cp -r` do codigo para dentro
  # do conteiner — o que nao preserva mtime e fazia o cargo recompilar 363 crates a cada corrida.
  # Medido: `cp -r` 363 recompilacoes / ~8 min, montagem direta **0** / 53s. Detalhe e numeros no
  # cabecalho do script (B-054).
  # `workflow_dispatch` continua disponível para rodar sob demanda num PR específico quando valer a pena.
  workflow_dispatch:
  # B-052 / ADR-0062 — o portao passou a olhar ANTES do merge.
  #
  # `pull_request` roda contra `refs/pull/N/merge`, ou seja, contra a arvore MERGEADA — a mesma
  # coisa que o `push` para `develop` testava, um passo antes. E `push: [develop]` saiu junto: sem
  # isso a mudanca DOBRARIA as corridas pesadas, e a restricao de capacidade que removeu o gatilho
  # de PR em 2026-08-12 e premissa deste item, nao obstaculo.
  #
  # Custo MEDIDO na janela de 9 dias (2026-08-11..20), nao estimado: 30 corridas pesadas por push
  # em `develop` (1410 min) para 13 PRs `workspace -> develop` mergeados. Com o gate no PR e
  # `cancel-in-progress` colapsando pushes sucessivos, sao ~13 corridas — MENOS que as 30 de hoje,
  # e olhando o codigo enquanto ele ainda pode ser recusado.
  #
  # `push: [main]` fica: e a verificacao pos-release, e `main` so avanca por PR de release.
  pull_request:
    branches: [develop, main]
    # #211 — NÃO adicione `paths-ignore:` aqui. O GitHub proíbe `paths` e `paths-ignore` no MESMO
    # evento e rejeita o arquivo no parse (`startup_failure`, zero jobs): foi o que matou este gate
    # em 95 de 100 runs entre 24 e 27/07. A economia de fila que #187 buscava se expressa DENTRO do
    # `paths:`, via padrão negado — um filtro só, sem conflito. `.claude/**` e `wiki/**` já estão
    # fora por construção; o `!**/*.md` é guarda de futuro (hoje não há `.md` sob `theodb_rs/src/`),
    # e este gate custa um `cargo pgrx install` completo — caro demais para um README.
    paths:
      - 'theodb_rs/src/**'
      - 'theodb_rs/Cargo.*'
      - 'scripts/cassert-smoke.sh'
      - '.github/workflows/cassert-sql-safety.yml'
      - '!**/*.md'

  push:
    branches: [main]
    # #211 — NÃO adicione `paths-ignore:` aqui. O GitHub proíbe `paths` e `paths-ignore` no MESMO
    # evento e rejeita o arquivo no parse (`startup_failure`, zero jobs): foi o que matou este gate
    # em 95 de 100 runs entre 24 e 27/07. A economia de fila que #187 buscava se expressa DENTRO do
    # `paths:`, via padrão negado — um filtro só, sem conflito. `.claude/**` e `wiki/**` já estão
    # fora por construção; o `!**/*.md` é guarda de futuro (hoje não há `.md` sob `theodb_rs/src/`),
    # e este gate custa um `cargo pgrx install` completo — caro demais para um README.
    paths:
      - 'theodb_rs/src/**'
      - 'theodb_rs/Cargo.*'
      - 'scripts/cassert-smoke.sh'
      - '.github/workflows/cassert-sql-safety.yml'
      - '!**/*.md'

permissions:
  contents: read

# Fila do runner self-hosted (2026-07-24): sem `concurrency`, cada push empilhava um run novo por
# workflow e NENHUM era cancelado — o runner processa um de cada vez, então a fila entupiu (32 runs
# ativos). Este grupo cancela runs superados do MESMO workflow no MESMO ref: só o commit mais recente
# de uma branch importa. `head_ref || ref_name` faz o evento `push` e o `pull_request` do MESMO commit
# caírem no MESMO grupo — sem isso cada commit disparava DOIS runs por workflow enquanto houvesse PR
# aberto da branch, dobrando a fila. Em `main` NUNCA cancela (um release em andamento não é abortado).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  cassert-and-pgspot:
    # 2026-08-20 — runner GitHub-hosted, como o resto da frota. Este é o job com a migração mais
    # cara: exige um PostgreSQL compilado com `--enable-cassert`, que os pacotes do PGDG NÃO
    # trazem. Na máquina paga esse PG foi montado à mão e o repositório nunca registrou como —
    # então a receita abaixo é reconstruída, não copiada.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # O `~/.pgrx` cassert é caro (compila PostgreSQL do fonte) e imutável para uma dada versão:
      # é exatamente o perfil que cache resolve. Primeira corrida paga; as seguintes, não.
      - name: Cache do PG cassert do pgrx
        id: pgrx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.pgrx
          key: pgrx-cassert-${{ runner.os }}-0.19.0-pg18

      - name: Compilar o PG cassert (só quando o cache erra)
        if: steps.pgrx-cache.outputs.cache-hit != 'true'
        env:
          # VERIFICADO em 2026-08-20, e por isso a marca de incerteza saiu. Esta é a via do pgrx para
          # repassar flags ao `configure`; ela foi escrita sem confirmação contra a 0.19.0 (o
          # repositório não guardava a receita usada na máquina antiga), e a corrida decidiu: o guard
          # do passo seguinte — `pg_config --configure | grep --enable-cassert` — PASSOU, logo a flag
          # chegou. O guard fica: ele é quem prova, a cada corrida, que o smoke sob Assert() não é
          # vacuoso.
          CONFIGURE_FLAGS: --enable-cassert
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libreadline-dev zlib1g-dev libssl-dev pkg-config
          command -v cargo-pgrx >/dev/null || cargo install --locked cargo-pgrx --version 0.19.0
          cargo pgrx init --pg18 download


      # DERIVADO, nunca hard-coded. O `18.4` que estava aqui era a versão que a máquina paga por
      # acaso tinha; o `cargo pgrx init --pg18` baixa a ÚLTIMA da série e instalou **18.6**, então o
      # caminho fixo apontou para um diretório inexistente e o guard reprovou — corretamente, mas
      # pela causa errada. Uma versão de patch do PostgreSQL não é decisão nossa e não deve virar
      # constante num workflow.
      - name: Resolver onde o pgrx instalou o PostgreSQL
        run: |
          set -euo pipefail
          PGRX_INSTALL=$(find "$HOME/.pgrx" -maxdepth 2 -type d -name pgrx-install | sort -V | tail -1)
          [ -x "$PGRX_INSTALL/bin/pg_config" ] || {
            echo "::error::nenhum pgrx-install com pg_config sob ~/.pgrx — o init não produziu o que promete" >&2
            ls -la "$HOME/.pgrx" 2>/dev/null || true
            exit 1
          }
          echo "PGRX_INSTALL=$PGRX_INSTALL" >> "$GITHUB_ENV"
          echo "resolvido: $PGRX_INSTALL  ($("$PGRX_INSTALL/bin/pg_config" --version))"

      - name: Instalar a extensão no PG cassert do pgrx
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          PGINST="$PGRX_INSTALL"
          "$PGINST/bin/pg_config" --configure | grep -q -- '--enable-cassert' \
            || { echo "::error::PG do pgrx não é cassert — o smoke seria vacuoso"; exit 1; }
          cd theodb_rs
          cargo pgrx install --features pg18 --pg-config "$PGINST/bin/pg_config"

      - name: pgspot — DDL inseguro na SQL de instalação (baseline dos 6 códigos atuais)
        run: |
          set -euo pipefail
          PGINST="$PGRX_INSTALL"
          # `find` em vez de `ls`: o glob do `ls` quebra em nome com espaço/newline (SC2012), e este
          # caminho vem do layout do pgrx, que não controlamos.
          SQL=$(find "$PGINST/share/postgresql/extension" -maxdepth 1 -name 'theodb_rs--*[0-9].sql' | sort -V | tail -1)
          echo "pgspot sobre: $SQL"
          command -v pgspot >/dev/null || pip install --break-system-packages -q pgspot
          # Baseline (SUNSET 2026-10-21, burn-down em #151): PS002=handlers de AM em C (tomam `internal`,
          # não invocáveis por usuário), PS010=CREATE SCHEMA de extensão, PS001/016/017=refs não-qualificadas em
          # corpos SECURITY INVOKER, PS005=search_path das funções SQL. Gate ainda pega códigos NOVOS (PS003 etc.).
          pgspot --ignore PS001 --ignore PS002 --ignore PS005 --ignore PS010 --ignore PS016 --ignore PS017 "$SQL"

      - name: cassert-smoke — 4 AMs + columnar sob Assert() (classe #143)
        run: |
          set -euo pipefail
          # O job roda como ghrunner (não-root), então `initdb` roda direto — sem o dança runuser/pgtest que só
          # o teste-como-root exigia. PGINST é o pgrx do próprio ghrunner (compilado com --enable-cassert).
          PGINST="$PGRX_INSTALL" PGPORT=28941 bash scripts/cassert-smoke.sh
