# dependabot — mantém as actions atualizadas. Ausente até 2026-08-20.
#
# POR QUE. Medido nos onze workflows: 42 referências a actions de terceiros fixadas por TAG
# (`@v4`), não por SHA. Tag é mutável — quem controla o repositório da action pode reapontá-la, e o
# consumidor recebe código novo sem diff. Fixar por SHA é o estado da arte; manter 42 SHAs à mão sem
# ninguém avisando de atualização é como eles envelhecem até virarem risco por outro caminho.
#
# As duas metades estão em vigor desde 2026-08-20: as 39 referências foram fixadas por SHA de 40
# caracteres com a tag ao lado em comentário (B-083), e o dependabot mantém as duas coisas em dia —
# quando ele atualiza, reescreve SHA E comentário juntos. A política está em
# `.github/CONTRIBUTING-workflows.md`, onde um autor de workflow a encontra sem ler o backlog.
#
# `github-actions` só. Cargo e Python deste repositório têm gates próprios (`license-gate` via
# cargo-deny, e o `deps-audit` do ciclo) — acrescentar aqui duplicaria o dono do problema.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
