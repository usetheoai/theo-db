# M4 HA topology: 3-node etcd (odd quorum, anti-split-brain) + 2 TheoDB-Patroni nodes (primary+standby).
# pgBackRest repo on a shared named volume. Bring up: docker compose -f ha/docker-compose.ha.yml up -d
name: theodb-ha

networks:
  ha: {}

volumes:
  pgbackrest_repo: {}

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  networks: [ha]
  restart: unless-stopped
  environment: &etcd-env
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: theodb-etcd

x-patroni: &patroni
  image: theo-db-ha
  networks: [ha]
  restart: unless-stopped
  environment: &patroni-env
    PATRONI_SCOPE: theodb
    PATRONI_ETCD3_HOSTS: "etcd1:2379,etcd2:2379,etcd3:2379"
    POSTGRES_PASSWORD: postgres
    REPL_PASSWORD: replpass
  volumes:
    - pgbackrest_repo:/var/lib/pgbackrest
  depends_on: [etcd1, etcd2, etcd3]

services:
  etcd1:
    <<: *etcd
    container_name: theodb-etcd1
    hostname: etcd1
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
  etcd2:
    <<: *etcd
    container_name: theodb-etcd2
    hostname: etcd2
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
  etcd3:
    <<: *etcd
    container_name: theodb-etcd3
    hostname: etcd3
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379

  patroni1:
    <<: *patroni
    container_name: theodb-patroni1
    hostname: patroni1
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni1
    ports:
      - "55460:5432"
      - "55461:8008"
  patroni2:
    <<: *patroni
    container_name: theodb-patroni2
    hostname: patroni2
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni2
    ports:
      - "55462:5432"
      - "55463:8008"
