[package]
name = "theodb_rs"
version = "1.0.0"
edition = "2024"
description = "TheoDB's own PostgreSQL extension in Rust (pgrx) — theodb.embed (M17, ROADMAP-v2 / ADR 0006)"
license = "Apache-2.0"

# M140.2 — theodb_rs is the workspace root; `lexical_core` (theodb_lexical) is the pgrx-FREE
# lexical engine core, testable with stock `cargo test -p theodb_lexical`. cargo-pgrx operates on
# the `theodb_rs` member as before (ADR 0053 / D2). Keeping the workspace INSIDE theodb_rs (not at
# the repo root) avoids dragging benchmarks/docs into a cargo workspace (KISS).
[workspace]
members = [".", "lexical_core"]

[lib]
crate-type = ["cdylib"]

[features]
# M135/ADR-3 — PG18 only. The pg13–pg17 features that used to sit here were never once compiled by anyone (the
# probe that opened M135 was the first `cargo check` against any of them), and a declared-but-unverified version
# claim is the same defect class this project rejects everywhere else. The owner chose to migrate rather than
# carry `#[cfg]` branching for a user base that does not exist yet.
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []
# M139 SPIKE — engine lexical própria sobre Tantivy. Atrás de feature: um spike que pode dar NO-GO NÃO incha o
# crate shipado (build/imagem) com uma dep pesada antes do veredito GO. O código vive em `src/lexical/` e só
# compila com `--features spike-lexical`. Promove a dep permanente só se o spike der GO (M140).
# M140.2 — the lexical core moved to its own pgrx-free crate `theodb_lexical`. The feature enables
# both the core crate (the Directory/MemStore/SegmentStore) AND tantivy directly (pg_backing.rs
# builds tantivy schemas in its flush-roundtrip tests). Same tantivy 0.26 → one in the tree.
# M186: as deps deixaram de ser opcionais — o GO do gate foi dado pelo ADR 0054 (Accepted). A feature
# sobrevive apenas para o andaime de medicao do spike (`lexical::pg_backing`), que NAO vai no default.
spike-lexical = []
# M143 — a feature `spike-parquet` foi promovida a permanente (parquet + arrow/json nas deps acima); o leitor
# own-code vive em `src/parquet.rs`, ligado por default. O spike deu GO (wiki/benchmarks/parquet-reader-owncode-spike.md).

[dependencies]
pgrx = "=0.19.0"
# Minimal audited HTTP client (ISC). `https-native` = OpenSSL/native-tls (NOT rustls) — deps-audit
# measured the rustls path pulls vulnerable rustls-webpki (RUSTSEC-2026-0098/0099/0104); OpenSSL is
# already in the builder stage. See plan ADR D2.
minreq = { version = "2", features = ["https-native", "json-using-serde"] }
serde_json = "1"
# M98 — the single-planner columnar+AI pillar's vectorized executor (upstream apache/datafusion, NOT paradedb's
# fork — Rule 9). Pinned to pg_search's proven datafusion-54/arrow-58 set; the coexistence with pgrx 0.19 is proven
# by build (`cargo tree -i arrow` single major). default-features=false to keep the cdylib lean (parsimony).
# M143 — lakehouse Parquet own-code no default: `parquet` (leitura/escrita de arquivos) + `arrow/json` (o leitor
# geral `theodb.read_parquet` serializa cada linha em jsonb via arrow-json). Promovidos de `spike-parquet` (spike
# GO — wiki/benchmarks/parquet-reader-owncode-spike.md) a permanentes: +9 MB no .so vs 118 MB do bundle DuckDB.
datafusion = { version = "54", default-features = false, features = ["parquet"] }
# M168 — o trait `futures::Stream` é o que `datafusion::physical_plan::RecordBatchStream` estende, então
# implementá-lo exige o crate em escopo. Já estava na árvore transitivamente via datafusion (0.3.32); declarar
# apenas torna o uso explícito (parsimony rung 4: reusar o instalado, não adicionar um redundante).
futures = { version = "0.3", default-features = false, features = ["std"] }
arrow = { version = "58", default-features = false, features = ["json"] }
# M139 spike (opcional — só com feature `spike-lexical`). Tantivy 0.26 é MIT (D1-limpo, verificado); o deny.toml
# barra qualquer AGPL transitiva. Dep OPCIONAL para não entrar no build shipado até o veredito GO.
tantivy = "0.26"
# M140.2 — the pgrx-free lexical core (path dep, opcional sob spike-lexical). O tantivy vem
# transitivo daqui também; a versão casa (0.26) → uma única no tree.
theodb_lexical = { path = "lexical_core" }
tokio = { version = "1", features = ["rt"], default-features = false }
# M99 — columnar stripe compression (zstd). Already in the tree transitively via datafusion/arrow (parsimony rung 4
# — reuse before adding); MIT/BSD-licensed, D1-clean. default-features=false keeps it lean.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
pgrx-tests = "=0.19.0"
# FU-1: criterion drives the same-graph scan-allocation micro-bench (`benches/scan_hot_path.rs`). Dev-only →
# never links into the released cdylib (parsimony rung 4). Pinned to pgvectorscale's version (same pgrx stack).
criterion = "0.5.1"

# FU-1 same-graph micro-bench: measures the M46 pre-size vs `::new()` allocation cost over a fixed synthetic
# graph. `harness = false` → criterion owns `main()`. The bench `#[path]`-includes the PURE `ann/scan_core.rs`
# (zero `crate::`/`pg_sys` refs) so it links standalone WITHOUT a PostgreSQL runtime (blueprint Q5).
[[bench]]
name = "scan_hot_path"
harness = false
# M144 (test-infra fix): `test = false` so `cargo test` / `cargo pgrx test` do NOT compile this bench. Under the
# `pg_test` feature the crate's PG-symbol-dependent code cannot link into a standalone bench binary (the extension
# is a cdylib loaded into Postgres, where those symbols resolve) — building the bench under `cargo pgrx test`
# failed at link time and blocked EVERY #[pg_test] in the crate. The bench is for `cargo bench` (no pg_test), not
# for the test harness.
test = false

# LOAD-BEARING, not a size/style choice: pgrx 0.19 turns a PG `ERROR` into `panic_any` so Rust frames UNWIND and
# run their destructors before `ereport` is finally called at the guard boundary (pgrx-pg-sys panic.rs:155-160).
# Switching either profile to `panic = "abort"` would turn every `pg::err_*` — including the M134 SSRF denial —
# into an immediate process abort, i.e. a crashed backend instead of a typed error. Do not change.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1

# M136 — baseline do cargo-machete. `arrow` é flagado como dep direta não-usada: todo uso de Arrow no crate
# passa por `datafusion::arrow` (re-export), não `use arrow::`. Mantido em baseline (não removido) porque a
# declaração pode alinhar a versão de `arrow` (58) à esperada pelo `datafusion`, e removê-la às cegas arrisca
# drift de resolução. Burn-down: confirmar que o datafusion re-exporta a mesma versão e então remover a dep.
[package.metadata.cargo-machete]
ignored = ["arrow"]
