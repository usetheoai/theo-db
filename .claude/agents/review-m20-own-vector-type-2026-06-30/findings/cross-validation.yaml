findings:
  - id: XV-1
    severity: MEDIUM
    title: "ROADMAP-v2 M20 DoD-A literal text ('Tipo próprio + 3 operadores') delivered as coexistence FUNCTIONS"
    location: "ROADMAP-v2.md M20 vs theodb_rs/src/lib.rs extension_sql + plan ADR D1"
    detail: >
      The ROADMAP-v2 M20 DoD-A reads "Tipo próprio + 3 operadores em Rust". The slice ships neither an
      own storage `type` nor redefined operators `<->`/`<#>`/`<=>`; it ships 3 NEW distance FUNCTIONS
      (theodb.l2_distance/inner_product/cosine_distance) reading pgvector's values. This is the
      blueprint(97.3)+ADR-D1-resolved reinterpretation (competing type forks data/breaks indexes;
      duplicate operators conflict; own operators+opclass DEFERRED to M21) and IS the honest migration
      decision DoD-B asks for. The plan's own Drawbacks table explicitly names "'Own type' DoD interpreted
      as a competing storage type" and resolves it via ADR D1. So plan<->impl<->tests are CONSISTENT;
      the divergence is plan<->ROADMAP literal text.
    documented: true
    sound: true
    silent: false
    downstream_action: >
      Human reconciliation only: accept the documented reinterpretation (coexistence functions at proven
      parity = M20 satisfied; type/operators substitution gated to a future milestone) OR adjust the
      ROADMAP-v2 M20 DoD wording to match. No code change required; not a blocker.

  - id: XV-2
    severity: LOW
    title: "KEY divergence: #[repr(C)] FFI reader (plan T1.1/ADR D1) implemented as ::real[]/Vec<f32> cast"
    location: "theodb_rs/src/vec.rs (module doc L5-11) + lib.rs extension_sql ::real[] casts"
    detail: >
      Plan T1.1 + Baseline + ADR D1 prescribed an `#[repr(C)] PgVectorBytes` reader with manual
      pg_detoast_datum (to close EC-1). Impl instead casts `vector::real[]` (pgvector's own lossless
      CREATE CAST, sql/vector.sql:157) -> pgrx-native Vec<f32>. ANALYSIS: (a) SOUND — same exact f32
      bits, pgrx maps real[]->Vec<f32> and performs detoast (EC-1 closed) with ZERO unsafe; f32
      accumulation preserved; (b) DOCUMENTED — vec.rs module doc, lib.rs comment, impl summary L24-28,
      commit df12554 body, CHANGELOG all call it a "parsimony refinement of the blueprint's #[repr(C)]
      observation"; (c) SATISFIES ADR D1 INTENT — coexistence, reads pgvector's values, no competing
      type, parity. Aligned with rules/parsimony-ladder.md (reuse existing cast; avoid unsafe).
      Conclusion: documented, sound parsimony refinement — NOT a silent plan-violation.
    documented: true
    sound: true
    silent: false
    downstream_action: "None (record only). Refinement is the architecturally correct, parsimony-aligned call."

  - id: XV-3
    severity: LOW
    title: "Goal 'byte-identical text output' achieved as tolerance-based parity (REL_TOL 1e-5, ~1e-6 observed)"
    location: "plan Goal L14-16 / Coverage Matrix vs test_vector_ops.py REL_TOL + ADR D3"
    detail: >
      The plan Goal/Coverage Matrix say "byte-identical text output to pgvector". The installed pgvector
      uses VECTOR_TARGET_CLONES SIMD which reorders the f32 sum, making byte-identical text physically
      unachievable. Impl asserts parity within REL_TOL=1e-5 (observed ~1e-6) — exactly what the same
      plan's ADR D3 prescribes ("assert to rounded TEXT output; bit-exact vs SIMD best-effort"). Honest
      and public-copy.md-compliant. The Goal headline wording is aspirational and superseded by ADR D3.
    documented: true
    sound: true
    silent: false
    downstream_action: "None (record only). Honest framing; consistent with in-plan ADR D3."

  - id: XV-4
    severity: LOW
    title: "EC-1 (TOAST) detoast coverage relocated from a Rust #[pg_test] datum round-trip to pgrx cast + Python high-dim parity"
    location: "plan T1.1 TDD (pg_test round-trip) vs test_vector_ops.py high-dim (1536/16000)"
    detail: >
      Plan T1.1 specified a Rust #[pg_test] round-tripping a real '[...]'::vector datum through the
      detoasting reader. With no FFI reader, detoast is handled by pgrx during the ::real[] cast and
      exercised by the Python high-dim parity rows (dim 16000 is column-stored/TOASTable). EC-1 is thus
      covered, just relocated to the integration tier. Localization is slightly weaker (no Rust-unit
      assertion of detoast), but the 16000-dim live-parity row is a genuine TOAST exerciser.
    documented: true
    sound: true
    silent: false
    downstream_action: "None (record only)."

  - id: XV-5
    severity: INFO
    title: "vec.rs is 131 total lines vs the plan's 'vec.rs <= 120 LoC' acceptance budget"
    location: "theodb_rs/src/vec.rs"
    detail: >
      File is 131 lines TOTAL, exceeding the plan's '<=120 LoC' acceptance criterion (T1.1/Global DoD).
      Code-only (excluding the ~17-line module doc-comment and the ~60-line #[pg_test] mod) is ~33 LoC,
      well under budget. The run_validation file-size gate (<=500 LoC/file) passes. The overage is
