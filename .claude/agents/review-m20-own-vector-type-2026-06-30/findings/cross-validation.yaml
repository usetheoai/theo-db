agent: cross-validation
slug: m20-own-vector-type
date: 2026-06-30
scope: "plan <-> implementation <-> tests; task-by-task (T1.1,T1.2,T2.1,T3.1,T4.1,T5.1) + ADRs D1/D2/D3 + Coverage Matrix + 2 M20 DoDs + mandatory benchmark"
verdict: CONSISTENT_WITH_DOCUMENTED_DIVERGENCE
summary: >
  Implementation is faithful to the PLAN (which is plan-confidence SHIPPABLE) and to the tests.
  The KEY divergence flagged in the brief — plan ADR D1/T1.1 specified an `#[repr(C)]` FFI reader
  + manual detoast (EC-1), but the impl uses pgrx-native `Vec<f32>` mapped from pgvector's lossless
  `vector::real[]` cast — is (a) SOUND, (b) DOCUMENTED as a parsimony refinement in 5 places
  (vec.rs module doc L5-11, lib.rs comment, impl summary L24-28, commit df12554 body, CHANGELOG),
  and (c) fully satisfies ADR D1 INTENT (coexistence, reads pgvector's exact f32 values, no competing
  type, f32-parity preserved). It is NOT a silent plan-violation. The single MEDIUM is a literal-text
  divergence between the slice and the ROADMAP-v2 M20 DoD-A wording ("Tipo próprio + 3 operadores"):
  the slice ships 3 distance FUNCTIONS over pgvector's values (coexistence), not an own storage type
  and not redefined operators — which is exactly the blueprint(97.3)+ADR-D1-resolved, plan-locked
  reinterpretation and the honest migration decision DoD-B asks for. No blockers.

severity_counts:
  BLOCKER: 0
  HIGH: 0
  MEDIUM: 1
  LOW: 3
  INFO: 2

per_dod:
  - id: M20-DoD-A
    text: "Tipo próprio + 3 operadores em Rust; paridade numérica vs pgvector provada por teste."
    verdict: MET_BY_REINTERPRETATION
    detail: >
      3 distance ops at proven numeric parity: MET (theodb.l2_distance/inner_product/cosine_distance
      in theodb_rs/src/vec.rs; f32 accumulation; 17 Python parity tests vs LIVE pgvector + Rust
      #[pg_test] oracle/discriminating/dim-mismatch tests; benchmark max rel|Δ| ~1e-6). "Tipo próprio"
      + "operadores": delivered as NEW theodb.* FUNCTIONS (coexistence), NOT an own storage type and
      NOT redefined `<->`/`<#>`/`<=>` operators. This is the blueprint+ADR-D1 evidence-backed reading
      (a competing type forks data/breaks HNSW/IVFFlat/DiskANN/embed/hybrid/import; duplicate operators
      conflict on the shared type; own operators+opclass DEFERRED to M21). Documented & sound; literal
      ROADMAP wording is satisfied-by-reinterpretation, not verbatim. See finding XV-1.
  - id: M20-DoD-B
    text: "Decisão honesta de migração (coexistência vs substituição) documentada (compat de dados existentes)."
    verdict: MET
    detail: >
      Coexistence decision documented in ADR D1, CHANGELOG ([Unreleased] "Decisão de migração =
      coexistência"), impl summary ("Data-compat: total (no on-disk change)"), and benchmark doc.
  - id: M20-mandatory-benchmark
    text: "Reproducible parity+perf benchmark exists with data."
    verdict: MET
    detail: >
      benchmarks/bench_vector_ops.py + docs/benchmarks/m20-vector-ops-parity.md present with REAL
      measured data (dim=1536, rows=1500, runs=5): l2 max rel|Δ|=1.142e-6, ip=1.733e-6, cosine=1.680e-6;
      perf ~3.8x scalar-vs-SIMD (honest framing); pgvector 0.8.3 (live, CK-1) recorded; methodology +
      repro command present; script gates (exit 1) on parity > tolerance.

per_task:
  T1.1:
    plan: "#[repr(C)] PgVectorBytes reader + as_slice + pg_sys::pg_detoast_datum (closes EC-1)"
    impl: "NO FFI struct; pgrx Vec<f32> via vector::real[] cast; pgrx handles detoast"
    verdict: REFINED_DOCUMENTED
    note: "Coexistence + binary-equal f32 values + EC-1 closed, with ZERO unsafe. Intent met; literal artifact not built. See XV-2."
  T1.2:
    plan: "CK-1 doc note: record installed pgvector commit; Phase-4 compares to LIVE pgvector"
    impl: "doc records pgvector 0.8.3 (live extversion); Python suite compares theodb.* to live pgvector funcs"
    verdict: MET
    note: "Records version (0.8.3) rather than commit 586e7515; self-consistent with the plan's live-comparison design."
  T2.1:
    plan: "l2/inner_product/cosine in vec.rs, f32 accumulation; dim-mismatch 22023"
    impl: "vec.rs l2_distance/inner_product/cosine_distance; f32 sums; check_dims->err_input(22023)"
    verdict: MET
    note: "Oracle unit tests + f32_accumulation_not_f64 discriminating test + dim_mismatch_rejected_22023 present (ADR D2 proven)."
  T3.1:
    plan: "3 #[pg_extern] + extension_sql theodb.l2_distance/inner_product/cosine_distance(vector,vector) float8, REVOKE, coexistence"
    impl: "lib.rs _vec_l2/_vec_ip/_vec_cosine + extension_sql theodb.* IMMUTABLE STRICT PARALLEL SAFE, casting ::real[]; REVOKE-from-PUBLIC; no operator clobber"
    verdict: MET
  T4.1:
    plan: "pytest parity vs pgvector oracle + boundaries (dim1, 1536, 16000, NaN/inf, dim-mismatch, NULL)"
    impl: "test_vector_ops.py 17 tests; PAIRS incl. dim1, 3e38(inf); highdim 1536 & 16000; dim-mismatch raises; NULL->NULL; REVOKE; <#> = -ip"
    verdict: MET
    note: "Parity asserted within REL_TOL=1e-5 (ADR D3), not byte-identical text — honest, consistent with in-plan ADR D3. See XV-3."
  T5.1:
    plan: "bench_vector_ops.py + docs/benchmarks/m20-vector-ops-parity.md: parity max-diff + perf mean±std >=3 runs; record pgvector commit"
    impl: "present with real data; runs=5; parity gate exits 1 on violation; records pgvector 0.8.3"
    verdict: MET

adrs:
  D1:
    intent: "coexistence; read pgvector's values; no competing type; functions not redefined operators"
    verdict: HONORED_WITH_REFINEMENT
    note: "Refined to ::real[]/Vec<f32> (no unsafe FFI). Intent fully met. Refinement documented across 5 artifacts."
  D2:
    intent: "f32 accumulation (bit determinant), f64 sqrt/divide, cosine clamp [-1,1] then 1-sim, negative IP"
    verdict: HONORED
    note: "vec.rs accumulates in f32; sqrt/divide f64; .clamp(-1,1); <#> = -inner_product. Proven by f32_accumulation_not_f64 + benchmark 1e-6."
  D3:
    intent: "parity to text within f32-SIMD tolerance; no false bit-exact claim"
    verdict: HONORED
    note: "REL_TOL=1e-5 in tests; benchmark ~1e-6; doc + impl summary frame scalar-vs-SIMD honestly."

