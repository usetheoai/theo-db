slug: m20-own-vector-type
date: 2026-06-30
domain: database / pgrx correctness
scope: >
  theodb_rs/src/vec.rs, the M20 extension_sql! + #[pg_extern] block in theodb_rs/src/lib.rs,
  theodb_rs/theodb_rs.control, theodb_rs/src/pg.rs (err_input), benchmarks/tests/test_vector_ops.py,
  docs/benchmarks/m20-vector-ops-parity.md. Diff origin/main..develop.
verdict: READY_TO_MERGE
summary: >
  The M20 distance-op slice is database-correct. The function-property flags (IMMUTABLE / STRICT /
  PARALLEL SAFE) are all justified, the vector::real[] cast is genuinely lossless and safe under pgrx's
  Vec<f32> mapping, coexistence with pgvector is clean (schema-qualified new functions, no operator/type/
  index touched), and the extension-dependency ordering guarantees the vector type + cast exist at CREATE
  time. No BLOCKER/HIGH. One MEDIUM (volatility/parallel-safety mismatch between the IMMUTABLE PARALLEL SAFE
  SQL wrappers and their pgrx-default-VOLATILE/PARALLEL-UNSAFE inner functions — blocks SQL inlining, an
  undocumented per-row overhead) and two LOW (SQLSTATE 22023 vs pgvector's 22000 mislabeled "parity"; the
  per-call ::real[] materialization is a real but documented, parity-milestone-acceptable perf footgun).

severity_counts:
  BLOCKER: 0
  HIGH: 0
  MEDIUM: 1
  LOW: 2
