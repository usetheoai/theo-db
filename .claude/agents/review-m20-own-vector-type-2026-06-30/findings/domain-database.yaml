findings:
  - id: DB-M20-001
    severity: MEDIUM
    title: >
      IMMUTABLE/PARALLEL SAFE SQL wrappers call pgrx-default VOLATILE / PARALLEL-UNSAFE inner functions →
      SQL inlining is skipped, adding an undocumented per-row dispatch overhead
    location: theodb_rs/src/lib.rs:158-175 (inner #[pg_extern]) vs :395-407 (wrappers)
    evidence: >
      The public wrappers are declared `LANGUAGE sql IMMUTABLE STRICT PARALLEL SAFE` (lib.rs:398,402,406)
      and their bodies call `theodb_rs._vec_l2/_vec_ip/_vec_cosine`. Those three inner functions use a BARE
      `#[pg_extern]` (lib.rs:158,166,172) — confirmed no `#[pg_extern(...)]` attribute appears anywhere in
      lib.rs. pgrx's default volatility for a bare #[pg_extern] is VOLATILE, and the default parallel mode is
      PARALLEL UNSAFE. PostgreSQL does NOT reject an IMMUTABLE SQL function whose body calls a VOLATILE
      function (no CREATE-time check), and it TRUSTS the wrapper's declared IMMUTABLE/PARALLEL SAFE — so
      correctness is preserved (the math truly IS immutable + parallel safe, so the wrapper's declaration is
      the honest one). BUT `inline_function()` refuses to inline a SQL function when inlining would relax its
      declared volatility/parallel-safety relative to the body. Result: the IMMUTABLE wrapper is NEVER
      inlined into the calling query; every row pays a full function-call dispatch into the Rust function ON
      TOP of the documented ::real[] materialization. This is real per-row overhead that the perf doc
      (docs/benchmarks/m20-vector-ops-parity.md) does not account for — it attributes the 3.9x slowdown
      solely to scalar-vs-SIMD.
    impact: >
      Correctness: none (planner honors the wrapper's IMMUTABLE/STRICT/PARALLEL SAFE; the inner functions are
      REVOKEd and only reached via the STRICT wrapper, so the VOLATILE/parallel-unsafe inner marking is never
      semantically exercised). Perf + hygiene: missed inlining = extra dispatch per row; the inner functions'
      VOLATILE label is also simply wrong (they are pure).
    recommendation: >
      Annotate the three inner functions `#[pg_extern(immutable, parallel_safe, strict)]` so volatility and
      parallel-safety are honest end-to-end and the SQL wrapper becomes inlinable (removes one of the two
      per-row overheads on a milestone whose whole point is owning the computation). Non-blocking and trivial;
      ship-then-fix is acceptable since the user-facing wrapper declarations are already correct.

  - id: DB-M20-002
    severity: LOW
    title: dim-mismatch raises SQLSTATE 22023, but pgvector's CheckDims raises 22000 — "parity" is overclaimed
    location: theodb_rs/src/vec.rs:21-29 + theodb_rs/src/pg.rs:7-16; plan claims at plan-m20:180,253,318
    evidence: >
      check_dims → err_input → ERRCODE_INVALID_PARAMETER_VALUE = SQLSTATE 22023 (pg.rs:10). pgvector's
      CheckDims raises `errcode(ERRCODE_DATA_EXCEPTION)` = SQLSTATE 22000. The plan repeatedly states
      "22023 parity with pgvector's CheckDims" (plan:180,253,318). The pg.rs:7 docstring honestly says
      "Diverges." but the plan/test naming ("parity") imply the SQLSTATE matches when it does not. The
      message text also carries a "theodb vector op: " prefix (vec.rs:24), so it is NOT byte-identical to
      pgvector's "different vector dimensions %d and %d" either.
    impact: >
      A client that branches on the exact SQLSTATE of pgvector's dim-mismatch error gets a different code from
      theodb.*. Functionally fine — 22023 (invalid_parameter_value) is a defensible, typed, fail-fast code
      for a dimension mismatch (Unbreakable Rule 8 satisfied). The parity test (test_dim_mismatch_raises) only
      asserts `psycopg2.Error` is raised, so it does not (and cannot) catch the SQLSTATE divergence.
    recommendation: >
      Keep 22023 if intentional, but stop calling it "parity": reword the plan/comment to "raises a typed
      22023 (intentional divergence from pgvector's 22000)", OR switch to ERRCODE_DATA_EXCEPTION (22000) to
      make the claim true. Documentation-honesty fix, not a code blocker.

  - id: DB-M20-003
    severity: LOW
    title: per-call vector::real[] materialization is a real (documented, parity-acceptable) perf footgun
    location: theodb_rs/src/lib.rs:399,403,407 (a::real[], b::real[]); vec.rs scalar loops
    evidence: >
      Each invocation casts both `vector` args to `real[]` (a palloc'd array copy) which pgrx then copies into
      a Vec<f32> — two extra full-vector copies vs pgvector's direct datum access — and the math is scalar f32
      (no SIMD). docs/benchmarks/m20-vector-ops-parity.md measures a ~3.9x slowdown at dim 1536 and frames it
      honestly as scalar-vs-SIMD, M21+ work. Additionally, because these are plain functions with no operator
      class, `theodb.l2_distance(col, q)` in WHERE/ORDER BY does a seqscan and CANNOT use pgvector's
      HNSW/IVFFlat/DiskANN indexes — only pgvector's `col <-> q` operators can. This is by design (coexistence,
      parity not perf) but is an important usage caveat.
    impact: >
      Acceptable for M20 (parity milestone; perf delta documented with reproduction). Risk is only if a future
      caller assumes theodb.* is an index-accelerated drop-in for pgvector's operators — it is not.
    recommendation: >
      No change for M20. Consider a one-line note in the function COMMENT (or M21 docs) that theodb.* distance
      functions are not index-accelerated and are intended for parity/computation-ownership, not ANN scans.

  - id: DB-M20-004
    severity: INFO
    title: IMMUTABLE / STRICT / PARALLEL SAFE on the wrappers are all CORRECT (and genuine pgvector parity)
    location: theodb_rs/src/lib.rs:398,402,406
    evidence: >
      IMMUTABLE: l2/ip/cosine are pure deterministic functions of their inputs — no GUC reads, no table/SPI
      access, no clock/RNG (vec.rs:33-68). Scalar f32 math is deterministic per build, so same input → same
      output. CORRECT. STRICT: NULL vector in → NULL out without invoking Rust; this MATCHES pgvector's own
      strict distance functions (genuine parity), and the err_input dim-check therefore only ever sees
      non-NULL args. CORRECT. PARALLEL SAFE: no shared mutable state, no parallel-restricted access — pure
      compute. CORRECT. pgvector's own l2_distance/inner_product/cosine_distance are likewise IMMUTABLE STRICT
      PARALLEL SAFE, so these three flags are real parity, not just defensible.

  - id: DB-M20-005
    severity: INFO
    title: vector::real[] cast is lossless and safe under pgrx Vec<f32> (no NULL-element hazard)
    location: theodb_rs/src/lib.rs:159,167,173 (Vec<f32> args) + :399,403,407 (cast)
    evidence: >
      pgvector stores elements as f32 (real); `CREATE CAST (vector AS real[])` yields the exact f32 bits with
      no rounding — binary-equivalent, matching vec.rs module doc (vec.rs:5-11). A pgvector value is always a
      dense, non-NULL float array, so the produced real[] never contains NULL elements; pgrx's `Vec<f32>`
      (non-Option element) mapping is therefore the correct choice and cannot error on a NULL element. No
      `unsafe` and pgrx handles detoast (closes EC-1). CORRECT.

  - id: DB-M20-006
    severity: INFO
    title: Coexistence with pgvector is clean — no operator/type/cast/index conflict
    location: theodb_rs/src/lib.rs:387-428
    evidence: >
      The M20 block only CREATEs FUNCTIONs in the existing `theodb` schema (theodb.l2_distance /
      inner_product / cosine_distance) plus REVOKEs. It does NOT redefine pgvector's `<->`/`<#>`/`<=>`
      operators, does NOT CREATE TYPE, does NOT CREATE CAST, and adds no operator class — so pgvector's
      type and HNSW/IVFFlat/DiskANN indexes are untouched, and embed/hybrid/import code is unchanged (diff
      shows only additive lib.rs/vec.rs + tests/docs). Functions are schema-qualified (theodb.*), so the
      bare-name collision with pgvector's `l2_distance`/`inner_product`/`cosine_distance` (which live in
      pgvector's own schema, separate extension per control `requires = 'vector, theodb'`) is resolved by the
      schema qualifier; all test call sites qualify explicitly. CORRECT.
    note: >
      Residual (negligible) risk only if pgvector were ever installed INTO the `theodb` schema — then the
      bare names would clash. pgvector installs into its own schema, so this does not occur here.

  - id: DB-M20-007
    severity: INFO
    title: Extension ordering guarantees vector type + ::real[] cast exist at CREATE FUNCTION time
    location: theodb_rs/theodb_rs.control (requires = 'vector, theodb') + lib.rs:427 (requires = [_vec_*])
    evidence: >
      The control file declares `requires = 'vector, theodb'`, so BOTH the `vector` extension (providing the
      type and the vector→real[] cast) and the `theodb` umbrella (owning the `theodb` schema) are installed
      before theodb_rs. The wrapper's signature uses `a vector, b vector` and its SQL body casts `a::real[]`,
      both of which are validated at CREATE FUNCTION time — and both the type and cast are present by then.
      The intra-extension `requires = [_vec_l2, _vec_ip, _vec_cosine]` (lib.rs:427) sequences the inner pgrx
      functions ahead of the SQL wrapper that references them. Ordering is correct; no chicken-and-egg.
