retirement_migration_check:
  file: sql/theodb--1.2--1.3.sql
  result: SAFE
  evidence: |
    Guard drops a routine ONLY when it is a member of extension `theodb` AND NOT a member of `theodb_rs`
    (two pg_depend EXISTS/NOT EXISTS checks). The four M19 Rust ports are created by the theodb_rs extension
    (extension_sql!), so they ARE theodb_rs members -> excluded by the NOT-EXISTS clause -> Rust-owned
    functions are NEVER dropped. Name set matches FUNCTION only: ('ai','nl_to_sql'),('ai','hybrid_search_rrf'),
    ('ai','hybrid_search'),('theodb','import_pinecone'). import_pinecone_chunked (PROCEDURE) and ai.nl_query
    (plpgsql keeper) are NOT in the set -> preserved. On fresh 1.3 install the regenerated base no longer
    defines these -> loop is a no-op. No risk of dropping the Rust-owned functions.

findings:
  - id: F-wire-1
    severity: LOW
    file: theodb_rs/src/hybrid.rs
    line: 95
    plan_ref: T2.1 (hybrid seam guard) / cycle-implement wiring triad pillar (b)
    summary: >
      The err_unsupported (0A000) seam-guard branch in run_rrf is statically reachable and called, but no
      integration test now exercises the 0A000 outcome. M19 moved hybrid into theodb_rs co-resident with
      theodb.embed, so test_hybrid_guard.py was honestly repurposed to assert 42883 (function itself gone)
      instead of 0A000. The defensive branch (theodb.embed individually dropped while theodb_rs stays) is a
      real but hard-to-reach path with zero test coverage.
    evidence: |
      hybrid.rs:90-99 calls err_unsupported when to_regprocedure('theodb.embed(text, text)') IS NULL.
      test_hybrid_guard.py diff: test_absent_raises_0A000 -> test_absent_raises_undefined (asserts
      psycopg2.errors.UndefinedFunction / 42883). No test asserts FeatureNotSupported/0A000 anymore.
      Disclosed honestly in implementation.md ("the defensive 0A000 guard remains in code for an
      individually-dropped embed") — not gamed.
    recommended_action: >
      Either add a targeted test that drops ONLY theodb.embed (DROP FUNCTION theodb.embed(text,text)) inside
      a rolled-back txn and asserts 0A000, OR accept as a documented defensive-only branch (LOW). Not a merge
      blocker — the branch is reachable code (clippy -D warnings/dead_code passed), just untested.
  - id: F-wire-2
    severity: INFO
    file: theodb_rs/src/{nl,hybrid,migrate}.rs
    line: 0
    plan_ref: cycle-implement wiring triad pillar (c) "runtime metric"
    summary: >
      Pillar (c) observability on the new paths is satisfied via typed SQLSTATE errors raised at ERROR level
      (server log per rejection) + the warn() retry log, but there is NO success-path counter/histogram/log
      (e.g. nl_to_sql.accept, hybrid.rows, import.count emitted on the happy path).
    evidence: |
      err_input/err_unsupported -> pgrx ErrorReport ERROR (pg.rs) = server log only on failure. Success paths
      (validated SQL returned, fused rows, inserted count) emit no metric. This is CONSISTENT with the existing
      M17/M18 house pattern (embed.rs/chat.rs also rely on typed errors + warn-on-retry; no success counters),
      so it is not a regression — recorded as INFO for trajectory awareness, not a defect.
    recommended_action: >
      No action required for M19. If/when an observability milestone adds counters to embed/chat, extend the
      same convention to nl/hybrid/import for parity.

