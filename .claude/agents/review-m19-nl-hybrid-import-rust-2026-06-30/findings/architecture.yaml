  - id: F-arch-1
    severity: MEDIUM
    file: theodb_rs/src/hybrid.rs
    line: 147
    plan_ref: "T2.1 Files to edit (l.238) + T3.1 Files to edit (l.271-272)"
    summary: >-
      api-surface boundary inconsistently placed — hybrid.rs and migrate.rs embed their
      #[pg_extern] entrypoints inside an in-module `#[pg_schema] mod theodb_rs`, while nl.rs
      (and all M17/M18 code) keep the externs in lib.rs. The plan's "Files to edit" put these
      externs in lib.rs.
    evidence: |
      hybrid.rs:147 / migrate.rs:83 — the api-surface lives INSIDE the domain module:
      ```rust
      #[pg_schema]
      mod theodb_rs {
          use super::run_rrf;
          #[pg_extern]
          fn _hybrid_search_rrf(...) -> TableIterator<...> { ... }
      ```
      vs the plan (l.238): "theodb_rs/src/lib.rs — externs + ai.hybrid_search_rrf ... wrappers"
      and (l.271-272): "theodb_rs/src/lib.rs — #[pg_extern] _import_pinecone + ... wrapper".
      Net effect: `#[pg_schema] mod theodb_rs` now appears in 3 files (lib.rs:31, hybrid.rs:147,
      migrate.rs:83); the pgrx externs are scattered (lib.rs 8, hybrid.rs 2, migrate.rs 1).
      Only nl.rs follows the convention — its `_nl_to_sql` extern is in lib.rs (l.102-106).
      lib.rs's own doc (l.13) still claims "lib.rs is the composition/api root + module map".
    recommended_action: >-
      Pick ONE convention and apply it to all three new modules. Either (a) move
      _hybrid_search_rrf/_hybrid_search_json/_import_pinecone into lib.rs's `#[pg_schema] mod
      theodb_rs` (as the plan specified and embed/chat/ai/nl already do), keeping the domain
      fns (run_rrf/import) as the only content of hybrid.rs/migrate.rs; OR (b) if co-locating
      the thin extern with its domain fn is the deliberate new house style, move _nl_to_sql out
      of lib.rs too and update the lib.rs "api root" doc-comment to say externs are co-located.
      Do not leave the boundary half-migrated.
  - id: F-arch-2
    severity: MEDIUM
    file: theodb_rs/src/pg.rs
    line: 3
    plan_ref: "ADR-1 (3-boundary layering) referenced in plan Baseline Context (l.62-64)"
    summary: >-
      Layering description is now stale/leaky — pg.rs claims to be "the only module that talks
      to the Postgres ABI", but nl.rs/hybrid.rs/migrate.rs call Spi and pgrx types
      (Spi, pgrx::Json/JsonB, TableIterator, #[pg_extern]) directly. The three new modules are
      labeled "Domain layer" yet are pgrx/SPI adapters, unlike the genuinely portable embed/chat.
    evidence: |
      pg.rs:1-3 (unchanged claim):
      ```rust
      //! pg-glue layer (blueprint ADR-1): the boundary between TheoDB's portable domain logic and
      //! PostgreSQL/pgrx internals ... it is the only module that talks to the Postgres ABI.
      ```
      But nl.rs:100 `Spi::get_one::<pgrx::Json>`, hybrid.rs:88/99/112/121 `Spi::*`,
      migrate.rs:38/49 `Spi::get_one_with_args`/`Spi::connect_mut` — all talk to the ABI.
      Each new module's header says "Domain layer (blueprint M19 ...)" (nl.rs:1, hybrid.rs:1,
      migrate.rs:1) while embed.rs/chat.rs route ALL ABI access through crate::pg (verified:
      `grep Spi embed.rs chat.rs` = none). So "domain" now means two different things.
    recommended_action: >-
      Update the pg.rs doc-comment to reflect reality: pg.rs is the typed-error/GUC glue, but
      ADR-C deliberately lets the SPI-orchestration modules (nl/hybrid/migrate) call Spi
      directly (the relational work IS SQL — there is no portable layer to extract). Reclassify
      those three in their headers as "SPI-orchestration / pgrx adapter" rather than "Domain
      layer (portable)", so the codebase does not imply a portability that does not exist. No
      code change required — this is a coherence/doc fix; the SPI usage itself is the accepted
      ADR-C decision.
