      edge nl→chat is acyclic.
    evidence: |
      nl.rs:57-59 comment + call:
      ```rust
      // Same crate → call the chat domain directly ... avoid a needless SPI hop.
      let raw = crate::chat::chat(Some(question), Some(&system), model);
      ```
    recommended_action: No action — sound. (One caveat already correctly noted in code: nl_query
      must call nl_to_sql at the SQL level, not Rust→Rust, so the nested EXPLAIN-SPI gets a clean
      context — see nl.rs:121-126 / ADR-F. That keeper boundary is correct.)
