      it is worth a one-line note that the order mirrors the public SQL signature.
  - id: F-arch-4
    severity: INFO
    file: theodb_rs/src/hybrid.rs
    line: 109
    plan_ref: "ADR-C / ADR-D2 (one fusion source of truth); D3"
    summary: >-
      ADR-C boundary is sound, NOT leaky — Rust owns orchestration/validation; Postgres executes
      the RRF/INSERT/EXPLAIN via SPI. Identifier quoting via Postgres `format('%I', …)` over SPI
      (not hand-rolled) is the correct non-reinvented, injection-safe choice (Unbreakable Rule 9).
      One fusion SQL string (FUSION_TEMPLATE) is the single source of truth shared by both the
      _rrf and json entrypoints (DRY).
    evidence: |
      hybrid.rs:111 build via `SELECT format($fq$...$fq$, $1,$2,$3,$4)` (Postgres %I), not a Rust
      identifier quoter; migrate.rs:37 same pattern; nl.rs:90 delegates relation enumeration to
      `EXPLAIN (FORMAT JSON)` rather than a Rust SQL parser (ADR-A). Both json + positional
      hybrid surfaces delegate to the one `run_rrf` (hybrid.rs:168, 204).
    recommended_action: No action — this is the right architectural call; recorded as positive evidence.
