  anti_injection_negative_cases_assert_specific_sqlstate: "YES — 22023->InvalidParameterValue, 25006->ReadOnlySqlTransaction, 42883->UndefinedFunction, dim-mismatch->DataException; plus DB-intact assertions. Not bare 'it throws'. (Specific exception SUBCLASSES are asserted; the exact 5-char SQLSTATE string is asserted only indirectly via the psycopg2 typed-exception mapping, which is acceptable.)"
  hybrid_guard_0A000_to_42883_legitimate: "YES, legitimate — reflects hybrid+embed co-residency in theodb_rs; not a weakening. Caveat: the 0A000 guard is now untested (F-tests-3)."
  version_requires_updates_honest: "YES — plpython3u dropped from requires drives the explicit 'CREATE EXTENSION plpython3u' reconstructions and the count 3->2 / version 1.2->1.3 edits; all honest."
  benchmark_no_regression_gate_meaningful: "YES — holds LLM RTT constant via the shared stub so the delta isolates the validation glue; >=3 runs enforced (returns 2 if --runs<3); ratio<=1.20 gate; honest 'no speedup claim' framing per public-copy.md."
  missing_coverage_rrf_math_import_dimmismatch_explain_nesting:
    rrf_math: "tie-break on the Rust path missing (F-tests-2); ordering/empty-leg/k-sensitivity covered; exact 1/(k+rank) numeric value verified only in the offline Python twin."
    import_dim_mismatch: "COVERED — test_import_pinecone_dim_mismatch asserts DataException + zero rows (no corrupt insert)."
    explain_nesting_fix: "COVERED IMPLICITLY — benign nl_query/nl_query_cfg returning rows is the de-facto regression guard for the pgrx::Json EXPLAIN read; no test is explicitly named for it (INFO-level)."

verdict_input: >
  No BLOCKER. One MEDIUM (missing Rust unit-test layer that the plan explicitly promised for its top risk),
  three LOW/INFO. The integration coverage of behavior is strong and the negative-case typing discipline is
  good; the gap is the unit/pyramid base and two unexercised invariants (RRF tie-break on the Rust path,
  the 0A000 seam guard).
