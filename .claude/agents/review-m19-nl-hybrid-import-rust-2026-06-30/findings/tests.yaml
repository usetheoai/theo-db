findings:
  - id: F-tests-1
    severity: MEDIUM
    file: theodb_rs/src/nl.rs:203
    plan_ref: "T1.1 TDD RED (#[pg_test] l2 banned-token / single-statement / select-with anchor) + Drawbacks 'High' mitigation ('Per-rule Rust unit tests + the 12 Python injection tests')"
    summary: >
      No Rust unit tests for the new nl/hybrid/migrate pure functions. The plan committed (TDD RED + the
      mitigation for its #1 High risk, byte-faithful L2 port) to per-rule Rust #[pg_test]s; none shipped.
      lib.rs's #[pg_test] module only covers M17/M18 embed. The L2 scanner (first_banned_token, has_do_block,
      starts_with_keyword, nl_fence_strip, strip_sql_comments) — the exact code whose byte-faithfulness is the
      load-bearing security property — has only slow Docker-integration coverage.
    evidence: |
      grep -rn 'pg_test|#\[test\]|cfg(test)' theodb_rs/src/  ->  only lib.rs:321-371 (embed_* tests, M17/M18)
      nl.rs has 7 pure helper fns (lines 130,145,188,203,225,230,256) with NO unit test.
      Post-retirement the "12 Python injection tests" exercise ONLY the Rust path (plpython3u removed), so the
      plan's "cross-language oracle" framing no longer holds at test time — there is no differential parity
      test (Rust scanner vs the plpython3u regex over a shared adversarial corpus). bench_nl.py reconstructs
      the plpy body but only times ONE benign query — it does not cross-check validation accept/reject parity.
    recommended_action: >
      Add #[pg_test]/unit tests in nl.rs for: first_banned_token catches 'pg_ls_dir(' and the 'pg_ls_' bare
      prefix; interior ';' rejected but a single trailing ';' accepted; select/with anchor (and reject a
      leading comment-then-DROP); has_do_block true for 'do  $$' and false for 'do_thing'; nl_fence_strip vs
      a non-fenced body. Cheap, fast, and they pin the byte-faithful contract independently of Docker.

  - id: F-tests-2
    severity: LOW
    file: benchmarks/tests/test_integration.py:296
    plan_ref: "T2.1 AC ('fused results match the RRF math (tie-break id ASC)')"
    summary: >
      RRF tie-break (two docs with identical fused score -> deterministic id ASC) is asserted ONLY in the
      offline Python twin (theodb_bench.hybrid), not against the Rust ai.hybrid_search_rrf. The Rust-path
      integration tests assert ordering and "k changes the score" but never an equal-score id-ASC tie-break,
      so a tie-break regression in the Rust-built SQL ('score DESC, id ASC') would not be caught.
    evidence: |
      test_hybrid.py::test_rrf_fuse_tie_break_is_id_asc  -> Python rrf_fuse only (offline, not the DB path)
      test_integration.py hybrid block: test_hybrid_fuses_both_legs asserts order; test_hybrid_k_param_changes_score
      asserts score delta; NO test seeds two docs with equal fused score to assert id-ASC on ai.hybrid_search_rrf.
    recommended_action: >
      Add an integration case: seed two docs that each rank 1 in exactly one leg with symmetric vectors so the
      summed RRF score ties, assert the returned order is id ASC against ai.hybrid_search_rrf.

  - id: F-tests-3
    severity: LOW
    file: benchmarks/tests/test_hybrid_guard.py:73
    plan_ref: "T2.1 (embed-seam guard 0A000 preserved) + Failure scenarios table"
    summary: >
      The 0A000->42883 change is a LEGITIMATE reflection of the new architecture (hybrid moved into theodb_rs,
      co-resident with theodb.embed, so dropping theodb_rs removes the function itself), NOT a weakening. But a
      side effect is that the defensive 0A000 (err_unsupported) seam guard, which the implementation says it
      kept in hybrid.rs for the individually-dropped-embed case, is now exercised by NO test. A regression in
      that guard (wrong SQLSTATE/message, or its removal) would go undetected.
    evidence: |
      test_hybrid_guard.py now: test_present_unchanged + test_absent_raises_undefined (42883). The old
      test_absent_raises_0A000 (FeatureNotSupported + "theodb.embed is unavailable") was removed; nothing
      replaces the 0A000 assertion. Implementation summary: "The defensive 0A000 guard remains in the Rust
      code for the (hard-to-reach) individually-dropped-embed case" — i.e. retained but untested.
    recommended_action: >
      Either add a test that reaches the 0A000 path (ALTER EXTENSION theodb_rs DROP FUNCTION theodb.embed
      inside a rolled-back tx, then call hybrid -> assert 0A000 + actionable message), or, if genuinely
      unreachable, file an ADR/INFO acknowledging the guard is dead defensive code rather than leaving an
      unexercised typed-error branch.

  - id: F-tests-4
    severity: INFO
    file: benchmarks/tests/test_unified.py:99
    plan_ref: "Baseline Context / current callers"
    summary: >
      Fixture comment imprecision (not a correctness bug): test_unified.py line 99 says "ai.summarize live in
      theodb_rs", while test_extension_install.py line 91 correctly asserts ai.summarize stays in the SQL
      umbrella (it is the sql/50 SQL wrapper that calls the Rust ai._chat). The extension_install marker
      assertion is honest; only the unified fixture comment is loosely worded.
    evidence: |
      sql/50-theodb-ai.sql:32  CREATE OR REPLACE FUNCTION ai.summarize(...)  (SQL wrapper, present in PARTS build text)
      test_unified.py:99 comment vs test_extension_install.py:91-92 comment -> contradictory wording about where ai.summarize lives.
    recommended_action: >
      Tidy the test_unified.py comment to say ai._chat/theodb.embed moved to theodb_rs while ai.summarize
      remains a SQL wrapper over ai._chat. No assertion change needed.

