summary: >
  The parity oracles (test_nl_sql.py 35, test_integration.py hybrid block, test_unified.py import block)
  are UNCHANGED and DO genuinely exercise the new Rust paths — against the rebuilt image the SQL functions
  ai.nl_to_sql / ai.hybrid_search_rrf / theodb.import_pinecone are now Rust-backed, so the existing Python
  suites are a real cross-language behavior oracle. Negative cases assert SPECIFIC typed SQLSTATEs
  (22023->InvalidParameterValue, 25006->ReadOnlySqlTransaction, 42883->UndefinedFunction, dim-mismatch->
  DataException) plus DB-intact — not bare "it throws". The version/requires test edits are honest reflections
  of plpython3u leaving `requires`. The benchmark no-regression gate is meaningful (LLM RTT held constant via
  the shared stub, ratio<=1.20, >=3 runs enforced). The hybrid_guard 0A000->42883 change is a legitimate
  reflection of hybrid moving into theodb_rs (co-resident with embed), NOT a weakening.
  The chief gap is pyramid balance: ZERO new unit tests for the new Rust domain functions despite the plan's
  TDD blocks and Drawbacks mitigation explicitly committing to per-rule Rust #[pg_test]s; the highest-rated
  risk in the plan (byte-faithful L2 port) is covered ONLY by the heavyweight Docker integration suite.

test_pyramid:
  rust_unit_added_for_m19: 0          # nl.rs/hybrid.rs/migrate.rs pure fns have NO #[pg_test]/#[cfg(test)]; lib.rs tests cover only M17/M18 embed
  python_unit_added: 0                # test_hybrid.py (offline RRF twin) is pre-existing + tests the Python theodb_bench.hybrid, NOT the Rust path
  integration_new_test_fns: 0         # no new test functions; 5 test files got fixture/assertion edits; oracles reused unchanged
  integration_assertion_updates: 5    # test_unified, test_hybrid_guard, test_ai_retirement, test_retirement_migration, test_extension_install
  e2e_added: 0
  new_non_test_artifact: benchmarks/bench_nl.py (a benchmark, not a test)
  note: >
    Pyramid is integration-only for the M19 surface. The pure, no-I/O scanner helpers in nl.rs
    (first_banned_token, has_do_block, has_word, starts_with_keyword, nl_fence_strip, strip_sql_comments,
    collect_relations) are textbook unit-test candidates (fast, deterministic, the base of testing.md §2)
    and have zero direct unit coverage.

