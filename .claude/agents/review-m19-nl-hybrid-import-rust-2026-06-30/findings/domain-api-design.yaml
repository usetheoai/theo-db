error_contract:
  status: PARITY
  details: >
    err_input -> SQLSTATE 22023 (ERRCODE_INVALID_PARAMETER_VALUE); err_unsupported -> 0A000
    (ERRCODE_FEATURE_NOT_SUPPORTED) matches the original embed-seam guard; 25006 (read_only_sql_transaction)
    raised by the unchanged plpgsql nl_query L3 sandbox; dim-mismatch 22xxx propagates from the native
    $2::vector cast. nl_to_sql rejection messages ("question must not be empty", "multiple statements are
    not allowed", "only SELECT/WITH queries are allowed (got: ...)", "banned token '...'", "procedural
    blocks are not allowed", "query did not plan (rejected): ...", "relation '...' is not in the allowlist")
    and import_pinecone messages match the originals verbatim. hybrid_search_rrf k/per_leg_limit/result_limit
    messages match verbatim.

migration_and_control:
  status: CORRECT
  details: >
    sql/theodb--1.2--1.3.sql conditionally DROPs ONLY the legacy theodb-owned ai.nl_to_sql / ai.hybrid_search_rrf
    / ai.hybrid_search / theodb.import_pinecone (FUNCTION), guarded by member-of-theodb AND NOT member-of-theodb_rs.
    import_pinecone_chunked (PROCEDURE, different proname) and ai.nl_query are never matched (keepers).
    theodb.control: default_version '1.3', requires = 'vector, vectorscale' (plpython3u dropped).

findings:
  - id: F-api-1
    severity: LOW
    file: theodb_rs/src/hybrid.rs
    line: 195
    plan_ref: ADR D3 — Rust orchestrates the SAME SQL via SPI; ai.hybrid_search(jsonb) thin JSON surface
    domain_anchor: sql/40-theodb-hybrid.sql:148-150 (original coalesce((config->>'k')::int, 60))
    summary: >
      ai.hybrid_search(jsonb) reads k/per_leg_limit/result_limit via serde as_i64(); the original plpgsql used
      (config->>'k')::int (text cast). A caller passing these as JSON STRINGS (e.g. {"k":"30"}) gets 30 in the
      original but silently falls back to the default (60/20/5) in Rust. Required-key strings and the integer
      JSON-number form (the documented/tested shape) are unaffected.
    evidence: |
      Rust: let as_i32 = |k,d| cfg.get(k).and_then(|v| v.as_i64()).map(|n| n as i32).unwrap_or(d);
      Orig: coalesce((config->>'k')::int, 60)   -- ->> casts a JSON string "30" to int 30
    recommended_action: >
      Non-blocking. Optionally coerce a JSON-string number (v.as_i64().or_else(|| v.as_str()?.parse().ok()))
      to retain the original's lenient text-cast behavior, OR document that numeric config keys must be JSON
      numbers. Tests pass numbers as JSON numbers, so no current test regresses.
  - id: F-api-2
    severity: INFO
    file: sql/60-theodb-nl.sql
    line: 8
    plan_ref: ADR-F — ai.nl_query stays plpgsql (L3 sandbox keeper)
    domain_anchor: implementation summary (ai.nl_query stays a thin plpgsql L3 keeper)
    summary: >
      The sql/60 header comment states "ai.nl_to_sql (the LAST plpython3u) AND ai.nl_query are now implemented
      in Rust", but ai.nl_query is in fact kept as plpgsql (correctly, per ADR-F and the 1.2->1.3 migration
      header which lists it as a keeper). Cosmetic doc inconsistency only — the function body, signature, and
      contract are intact and correct.
    evidence: |
      sql/60:8  "... AND `ai.nl_query` are now implemented in Rust by the"
      sql/60:25 CREATE OR REPLACE FUNCTION ai.nl_query(...) RETURNS jsonb LANGUAGE plpgsql
    recommended_action: Reword the sql/60 header comment so nl_query is described as the plpgsql L3 keeper (no code change).
  - id: F-api-3
    severity: INFO
    file: theodb_rs/src/lib.rs
    line: 211
    plan_ref: Baseline Context — current callers/dependents (ai.nl_query resolves ai.nl_to_sql by name)
    domain_anchor: sql/60-theodb-nl.sql:20-24 (creates cleanly before theodb_rs installs ai.nl_to_sql)
    summary: >
      ai.nl_to_sql now lives in the theodb_rs extension; ai.nl_query (theodb extension, plpgsql) resolves it at
      runtime via late binding. Same dependency model as embed; documented; test_unified installs theodb_rs
      CASCADE. Operationally, invoking ai.nl_query without theodb_rs installed surfaces a runtime 42883 rather
      than a curated error — acceptable and consistent with the embed seam, noted for operators.
    evidence: |
      ai.nl_query body: validated := ai.nl_to_sql(question, allowed_relations, model);  -- resolved at runtime
    recommended_action: None required. Optionally note the theodb_rs runtime requirement for ai.nl_query in docs.
