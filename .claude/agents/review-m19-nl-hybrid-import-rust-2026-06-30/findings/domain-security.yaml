    plan_ref: "ADR-C — identical parameterized SQL parity"
    domain_anchor: "rules/error-handling.md (typed, no magic truncation)"
    summary: >
      _hybrid_search_json coerces config ints via `as_i64() ... as i32` (silent truncation), where the
      plpgsql original used `(config->>'k')::int` which ERRORs (22003) on out-of-range. Not a security
      issue — k/per_leg_limit/result_limit are RRF constants / LIMIT bounds; any overflow that
      truncates <=0 is caught by the `>0` guards, and a value truncating to a small positive int is
      harmless. Noted as a minor parity nuance only.
    evidence: |
      hybrid.rs: as_i32 = |k,d| cfg.get(k).and_then(|v| v.as_i64()).map(|n| n as i32).unwrap_or(d)
      vs plpgsql: coalesce((config->>'k')::int, 60)  -- ::int raises 22003 on overflow.
    recommended_action: "Optional: range-check or use checked cast to mirror the 22003 behavior. No security impact."

