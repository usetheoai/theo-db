summary: >
  The anti-injection NL->SQL pipeline (L1/L2/L4) and the L3 read-only sandbox were ported to Rust at
  faithful parity with the plpython3u original (git 6c1dddb:sql/60). The 33-keyword L2 denylist is
  byte-identical (Rust BANNED == regex alternation, same order); the tokenize-and-equal scan is
  provably equivalent to the \b...\b regex for these fixed keywords (incl. the pg_ls_ bare-prefix
  edge). L4 keeps EXPLAIN(FORMAT JSON)-over-SPI with a recursive relation walk identical to the
  original, reading the json column as pgrx::Json (no parse divergence) — so the comma-join /
  quoted-ident / CTE class that was the original review BLOCKER stays closed; NO Rust SQL parser was
  introduced (ADR-A honored). The EXPLAIN string interpolation is safe because L2(a) rejects any
  non-comment ';'. Hybrid and import build dynamic SQL via Postgres-native format('%I') over SPI with
  table as regclass::text and every value as a bound parameter — no user/LLM-controlled text reaches
  SQL unquoted. All 8 new functions are REVOKE ALL FROM PUBLIC; the embed seam keeps its 0A000 guard.
  No hardcoded secrets; the plpython3u bench baseline (ai.nl_to_sql_plpy) is reconstructed study-only
  in a throwaway DB and not shipped; zero LANGUAGE plpython3u in sql/; plpython3u removed from
  control requires. The unchanged Python oracle test_nl_sql.py (drop/multi/exfil/non-allowlisted/
  comma-join/quoted-ident/stat_file -> 22023; write -> 25006, all asserting the exact SQLSTATE) is the
  cross-language parity proof. NO missed injection vector found. Findings are test-rigor (MEDIUM) and
  benign parity nuances (LOW/INFO).

