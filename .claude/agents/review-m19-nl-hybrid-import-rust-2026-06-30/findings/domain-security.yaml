  - id: F-sec-2
    severity: LOW
    file: theodb_rs/src/nl.rs
    line: 145-173
    plan_ref: "ADR-B — block-comment strip is DOTALL (/\\*.*?\\*/ over newlines)"
    domain_anchor: "blueprint §Security invariants (L2 must not regress)"
    summary: >
      strip_sql_comments diverges from the plpython3u re.sub(r"/\*.*?\*/", " ", re.S) for UNTERMINATED
      block comments and the /* -- */ interaction: Rust consumes from '/*' to EOF when no closing '*/'
      exists (Python leaves the unmatched text). Verified BENIGN: every "Rust strips more" case yields
      SQL with a malformed/unterminated comment, which is a Postgres syntax error -> L4 EXPLAIN (run on
      the RAW sql, not the stripped copy) fail-closes with 22023. The divergence can only ever make the
      L2 `low` copy MORE benign, never hide a token in a string that Postgres would execute (Postgres
      treats unterminated '/*' as an error, so no region exists that Rust strips-as-comment while PG
      executes-as-code). No read-exfil bypass is reachable.
    evidence: |
      sql = "select pg_read_file('/etc/passwd') /* unterminated"
        Rust low -> "select pg_read_file('/etc/passwd') " (token still present -> caught anyway);
        even if it weren't: L4 EXPLAIN on raw sql -> PG syntax error (unterminated /*) -> 22023 fail-closed.
    recommended_action: >
      No code change required for security. Optionally mirror Python exactly (only strip a terminated
      /* ... */) and add a unit test pinning the unterminated-comment behavior, so the parity claim in
      the ADR-B comment is enforced rather than asserted.

  - id: F-sec-3
    severity: LOW
    file: theodb_rs/src/nl.rs
    line: 130-142
    plan_ref: "ADR-B — fence strip is ^```[a-zA-Z]*\\n? / \\n?```$"
    domain_anchor: "blueprint §Security invariants (L1/L2 verbatim)"
    summary: >
      nl_fence_strip applies the TRAILING ```-strip UNCONDITIONALLY, whereas the plpython3u original
      only strips the trailing fence INSIDE `if sql.startswith("```")`. For an LLM output that ends in
      ``` but does not start with one, Rust strips the trailing fence (accepting an otherwise-benign
      query) while Python leaves it and L4 rejects it as a syntax error. BENIGN: the strip only removes
      trailing backticks (renders SQL more benign), and the result is still re-validated by L2 + L4 -
      it cannot introduce a banned op or relation. It is a behavioral parity divergence (Rust slightly
      more lenient) that could fail a strict byte-parity test, not an injection vector.
    evidence: |
      input "select 1```":
        Python: startswith("```") false -> no strip -> L4 EXPLAIN("select 1```") -> syntax error -> 22023.
        Rust:  strip_suffix("```") -> "select 1" -> passes L2 + L4 (benign) -> accepted.
    recommended_action: >
      Gate the trailing-fence strip on a leading-fence presence to match the original exactly, OR
      accept the divergence and document it. Add a unit test either way. No security impact.

