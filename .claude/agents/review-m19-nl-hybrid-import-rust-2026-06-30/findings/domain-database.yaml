summary_verdict: >
  No BLOCKER and no HIGH database/pgrx defect. The Rust ports preserve the load-bearing security
  semantics (L2 denylist byte-parity, L4 EXPLAIN-over-SPI allowlist, %I/regclass identifier quoting,
  read-only L3 sandbox, fail-fast typed 22023, faithful 22xxx dim-mismatch propagation). SPI
  read/write choice is correct (Spi::connect for the read-only fusion SELECT, Spi::connect_mut for the
  INSERT loop). One MEDIUM parity gap (L4 unplannable-query SQLSTATE) and one LOW parity gap (jsonb
  config type-strictness) are worth fixing or documenting; both are security-neutral. Two INFO notes.

findings:
  - id: F-db-1
    severity: MEDIUM
    file: theodb_rs/src/nl.rs
    line: 100-104
    plan_ref: "ADR D1 (L4 EXPLAIN allowlist) + Global DoD 'every injection case rejected with the same SQLSTATE (22023)' + blueprint §1 verbatim message table"
    domain_anchor: "plpython3u original sql/60 wrapped EXPLAIN in try/except -> plpy.error(..., sqlstate='22023') 'query did not plan (rejected)'"
    summary: >
      The L4 EXPLAIN-failure path does not reclassify a genuinely unplannable generated query to 22023.
      A query that survives L2 but references a non-existent relation, or is syntactically broken after
      comment-stripping, makes the planner raise its native ereport (e.g. 42P01 undefined_table / 42601
      syntax_error). That ereport longjmps past the `match Spi::get_one::<pgrx::Json>{ ... Err(e) =>
      err_input(...) }` arm, so the caller receives the planner's SQLSTATE, NOT 22023, and the verbatim
      "query did not plan (rejected)" message never surfaces. The original plpython3u caught ALL planner
      exceptions and reclassified them to 22023.
    evidence: |
      nl.rs:90-104 (the match arm intended to convert plan failure to 22023):
        let explain = format!("EXPLAIN (FORMAT JSON, VERBOSE false) {sql}");
        let plan: Value = match Spi::get_one::<pgrx::Json>(&explain) {
            Ok(Some(j)) => j.0,
            Ok(None)    => err_input("...query did not plan (rejected): empty plan"),
            Err(e)      => err_input(&format!("...query did not plan (rejected): {e:?}")),
        };
      The `Err(e)` arm only catches pgrx-level SPI/coercion errors (it is what the TEXTOID->Json fix
      addressed), NOT a downstream ereport from the planner. That ereport-longjmps-past-Rust behavior is
      independently CONFIRMED in this very slice by the import dim-mismatch path: migrate.rs:70-76 wraps
      `client.update(...).unwrap_or_else(|e| err_input(...))`, yet test_unified.py:296-304
      (test_import_pinecone_dim_mismatch) asserts psycopg2.errors.DataException (22xxx) — proving the
      `$2::vector` ereport longjmps PAST `unwrap_or_else` rather than being reclassified to 22023. The
      same longjmp applies to the EXPLAIN ereport. The author's own comment (nl.rs:97-99) even states the
      un-plannable query "propagates as a clean rejection (fail-closed)" — i.e. they accept a non-22023
      SQLSTATE on this path. No L4 test exercises it: every L4 injection test references an EXISTING but
      non-allowlisted relation (secret/pg_authid) so EXPLAIN SUCCEEDS and the allowlist loop fires the
      22023 (test_nl_sql.py:112-116, 206-222).
    security_impact: >
      None. The query is still rejected fail-closed (planning aborts before any relation is read; no data
      leak, no execution). This is a SQLSTATE/message PARITY divergence, not a weakened guard.
    recommended_action: >
      Either (a) wrap the EXPLAIN in a mechanism that survives nested SPI and reclassifies the error to
      22023 with the verbatim message (the author notes PgTryBuilder broke nested EXPLAIN — a targeted
      pre-validation or an explicit subtransaction-free catch may work), OR (b) accept the divergence and
      (b1) add a regression test asserting the actual SQLSTATE for an unplannable generated SQL and (b2)
      soften the Global DoD "same SQLSTATE" claim + the blueprint §1 message-parity row to document the
      exception. Do not leave the DoD claiming exact 22023 parity while this path returns 42P01/42601.

  - id: F-db-2
    severity: LOW
    file: theodb_rs/src/hybrid.rs
    line: 178-195
    plan_ref: "ADR D3 (Rust orchestrates the SAME SQL via SPI at parity) + T2.1 'identical RRF dynamic SQL'"
    domain_anchor: "plpgsql original sql/40 ai.hybrid_search(jsonb): (config->>'k')::int / config->>'query_vector' (text-coercion of any json scalar/array)"
    summary: >
      `_hybrid_search_json` reads numeric config via `as_i64()` and string/vector config via `as_str()`,
      which is type-STRICT, whereas the original plpgsql used `config->>'key'` (the `->>` operator coerces
      ANY json scalar — and an array — to text first). Divergence on non-canonical input shapes:
      `{"k":"100"}` (number as JSON string) -> Rust silently falls back to the default 60 while the
      original parsed 100; `{"query_vector":[1,0,0]}` (vector as JSON array) -> Rust `as_str()` returns
      None so it is treated as ABSENT (then it embeds query_text instead) while the original `->>` yields
      "[1, 0, 0]" and casts it `::vector`.
    evidence: |
      hybrid.rs:192  let as_i32 = |k,d| cfg.get(k).and_then(|v| v.as_i64()).map(|n| n as i32).unwrap_or(d);
      hybrid.rs:190-191  query_text/query_vector via get_str(...) = cfg.get(k).and_then(|v| v.as_str());
      vs origin/main sql/40: coalesce((config->>'k')::int, 60) and
        CASE WHEN config ? 'query_vector' THEN (config->>'query_vector')::vector ELSE NULL END.
      The TESTED convention is safe: test_integration.py:233-234 passes query_vector as a JSON STRING
      "[1,0,0]" and result_limit as a JSON NUMBER 5 — both of which the Rust path handles correctly. So
      this only bites callers who pass numbers-as-strings or vector-as-array.
    security_impact: "None — silent default/absence, never a privilege or injection change."
    recommended_action: >
      For full `->>` parity, coerce leniently: read numbers as `as_i64().or_else(|| as_str().and_then(parse))`
      and read query_vector as `as_str()` falling back to `to_string()` of a non-string Value (mirroring
      `->>`). Alternatively, document the strict JSON-typing convention (numbers as JSON numbers, vector as
      a JSON string) in the ai.hybrid_search(jsonb) COMMENT so callers are not surprised.

  - id: F-db-3
    severity: INFO
    file: sql/60-theodb-nl.sql
    line: 18-66
    plan_ref: "T1.2 'nl_query Rust port (L3 read-only sandbox)' — declared a Rust function"
    domain_anchor: "ADR-F (implementation) — nl_query stays plpgsql; original L3 sandbox semantics"
    summary: >
      Plan T1.2 declared `ai.nl_query` would be ported to Rust; the implementation instead KEPT it as a
      thin plpgsql L3 keeper (ADR-F) because nesting a Rust nl_query -> Rust nl_to_sql breaks the nested
      EXPLAIN-over-SPI in L4. From a database-correctness standpoint this is the SAFER choice and is not a
      defect: the L3 sandbox body (max_rows>0 guard 22023, set_config('transaction_read_only','on',true) +
      statement_timeout 5000 SET LOCAL, outer-LIMIT wrapper to avoid `LIMIT n LIMIT m`) is BYTE-IDENTICAL
      to the origin/main version, so write->25006 and the no-leak contract are fully preserved. Flagged
      only as a plan-vs-implementation deviation for cross-validation awareness.
    evidence: |
      sql/60-theodb-nl.sql nl_query body == origin/main:sql/60 nl_query body (verified line-by-line;
      only surrounding comments changed). nl.rs:121-126 documents WHY nl_query must call ai.nl_to_sql at
      the SQL level (clean execution context for the nested EXPLAIN-SPI).
    recommended_action: >
      No DB change needed. Ensure the cross-validation reviewer records the T1.2 deviation and that the DoD
      wording ("nl_query is Rust") is reconciled with ADR-F (the anti-injection core L1/L2/L4 IS Rust; the
      L3 transaction-control wrapper stays plpgsql by design).

  - id: F-db-4
    severity: INFO
    file: theodb_rs/src/hybrid.rs
    line: 111-118
    plan_ref: "ADR D3 (%I-safe) + T2.1/T3.1 acceptance 'hostile identifiers rejected/quoted, no injection'"
    domain_anchor: "plpgsql %I/regclass discipline (sql/40, sql/80)"
    summary: >
      VERIFIED SAFE (no issue): the dynamic SQL in hybrid.rs:111 and migrate.rs:37 is built by Postgres'
      own `format('%I'/'%s', $n)` executed over SPI with the identifiers passed as BIND PARAMETERS, and the
      table is a `regclass::text` substituted with `%s` (already safely quoted by Postgres). The hostile
      identifier paths (`emb;col` -> "emb;col"; table `"weird;name"` -> regclass-validated+quoted) cannot
      break out — this is byte-faithful to the plpgsql `%I` discipline. Covered by
      test_unified.py:280-289 (test_import_pinecone_safe_identifiers) and the hybrid injection-safety AC.
    evidence: |
      hybrid.rs:111  let build_q = format!("SELECT format($fq${FUSION_TEMPLATE}$fq$, $1, $2, $3, $4)");
                     args: [id_col.into(), vector_col.into(), tbl_text.into(), content_tsv_col.into()]
      migrate.rs:37  let build_q = format!("SELECT format($fq${INSERT_TEMPLATE}$fq$, $1, $2, $3, $4)");
      Identifiers never touch the format-string itself (they are $n params to the build query), and the
      dollar-quoted template's literal $1..$5 survive format() and bind at execution. SPI read/write split
      is also correct: Spi::connect (read-only) for the fusion SELECT (hybrid.rs:121); Spi::connect_mut
      (write) for the INSERT loop (migrate.rs:49). The VOLATILE embed call inside the STABLE hybrid wrapper
      runs before the read-only fusion and only performs outbound HTTP (no DB write) — parity with the
      original STABLE plpgsql calling VOLATILE theodb.embed; no read-only-transaction violation.
    recommended_action: "None — documented here as positive verification of the injection-safety AC."

